intro: "Costs are built bottom-up from published contract values and programme costs wherever they exist, and from delivered-mass × price-per-kg where they don't. Each milestone page shows the line items and the basis for every one."
caveat: "These are planning estimates, not quotes. Space programmes routinely overrun; NASA's own OIG has documented large overruns on SLS, Orion and OSAM-1. The high column includes margin for that, but real costs could still be higher. Where a figure is a contract ceiling, the actual spend may be lower."
delivery: "Delivery pricing used throughout the plan: small landers (under 1 t) at up to $1.2M per kg landed, Astrobotic's published price [benchmark]. Medium (about 3 t, Blue Moon Mark 1 class) and large (about 15 t) landers have no published price, so the plan assumes $0.4M–$1.0M per kg for medium and $0.2M–$0.6M per kg for large (ESTIMATE) and shows this assumption on every line that uses it. If heavy-cargo prices fall as SpaceX and Blue Origin claim, the totals drop sharply; if not, they rise."
