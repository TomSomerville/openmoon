- id: DD-013
  date: "2026-11-18"
  title: "Power transmission: every source within 3 km of cable run of the PMC, and each source converts to 3 kV AC on the spot"
  status: "Adopted; LR-1 output frequency match is an open item"
  note: "DD-014 (Nov 2026) keeps 3 km as the standard power run but allows extended runs of up to 10 km, at about 10–15% transmission loss, with receiving-end voltage regulation and a 1 kHz stability analysis for each run. Beyond 10 km is still rejected. This reopens the Shackleton-ridge point pair about 8 km apart and ISRU plants at NASA's 3–5 km distance (see DD-014)."
  affects: [M00, M04, M06, C04.1, C04.2, C04.3, C04.4, C06.1, C06.2, C07.1, kilopower-krusty-fission-test, us-lunar-reactor-1-sparc, vertical-solar-array-technology-vsat, lunar-ac-power-transmission, astrobotic-lunagrid-lite, roadmap, pbs]
  was: "Links were described as '1–3 km' (NASA's Artemis scale), but no maximum was set. The reactor sat 1–3 km from the habitat zone, the solar towers stood on two or three ridge points at any distance, and the ISRU plants could be 3–5 km away (NASA's estimate). How each source reached 3 kV AC was only sketched: 'step-up transformers at each source' and, for the towers, a 'line interface converter (UMIC class)'. The reactor's output frequency was not set."
  now: "1) Maximum power run: 3 km. Every generation source (VSAT towers, the LR-1-class reactor, KRUSTY-class units) must sit within 3 km of cable run of the PMC. Runs of 10–30 km are rejected for now. 2) Every source converts to 3 kV AC, 3-phase, 1 kHz (the DD-001 grid standard) right at the source. A low-voltage, UMIC-class inverter (parallel 1 kW modules converting 120 V DC to under 100 V AC) feeds a 1 kHz step-up transformer next to the source. Only low-voltage switches are used; the transformer does the step-up and has no switches. There are no high-voltage DC lines. 3) Chains: VSAT: native DC (voltage not published) → array regulator and shunt (curtailment and disconnect, DD-008) → UMIC-class inverter → 1 kHz transformer → 3 kV AC. KRUSTY-class: 8 Stirling linear alternators (single-phase AC, about 12 V RMS, ~100 Hz, 7–10 A each, for the engine family) → one controller per engine rectifies to DC and holds a set voltage → controller outputs paralleled onto one DC bus (the unit's native output; voltage not published) → UMIC-class inverter → 1 kHz transformer → 3 kV AC. The 12 V never leaves the machine. LR-1: native 3 kV RMS AC (SPARC requirement). The plan's interface requirement is 3 kV, 3-phase, 1 kHz at the reactor's output; whether that is specified to the vendor or met with a frequency converter at the reactor end is OPEN. 4) Cable: 3 kV AC, 3-phase, aluminium conductors with vacuum-rated insulation, laid on the surface; planning mass 325 kg per 1 km main cable and spool (NASA 2025)."
  why: "The user's decision. NASA's 2022 grid study chose 3 kV AC as mass-optimal and found 1 kHz the lightest AC option. It says a DC grid is practically limited to 1.2–1.5 kV for lack of radiation-hard high-voltage switches. Converting at the source with a low-voltage inverter and a transformer keeps every semiconductor switch at low voltage, which is the reason NASA chose AC. NASA's own 2025 fission reference design already does this for its Stirling option (controllers to 350 V DC, then DC-to-AC, then a transformer to 3 kVac). The same study shows why runs stay short: at 100 kW on 8 AWG cable at 1 kHz, 3 kV is usable to about 600 m and 6 kV to 2.5 km, rising to 18 kV for 20 km, and long distances 'may require dropping to lower frequency'. NASA's Artemis working scale is 1–3 km links at 2 kV and above. Holding every run to 3 km keeps the base on NASA's 3 kV, 1 kHz design scale."
  timeline:
    - date: "Aug 1991"
      what: "Space Station Freedom's solar source subsystem holds a 160 V DC primary bus by shunting array strings. This is the nearest published figure for a large space solar array bus; VSAT's array voltage is not published."
      title: "Button, NASA TM-104510: Development and testing of a source subsystem for the PMAD DC test bed"
      url: "https://ntrs.nasa.gov/api/citations/19910016888/downloads/19910016888.pdf"
    - date: "Mar 2017"
      what: "The 1 kWe Kilopower baseline places its Stirling convertors in opposed pairs, hot ends together, so their inertia forces cancel through synchronous motion control."
      title: "Gibson et al., NASA's Kilopower reactor development and the path to higher power missions (NTRS 20170002010)"
      url: "https://ntrs.nasa.gov/citations/20170002010"
    - date: "Jul 2018"
      what: "NASA Glenn lists its Stirling convertors. The Advanced Stirling Convertor family, which KRUSTY's Sunpower engines come from, gives about 12 V RMS at 7–10 A and 102–103 Hz (ASC-1, ASC-L)."
      title: "Dugala, NASA Glenn: Stirling convertor controller development (presentation)"
      url: "https://ntrs.nasa.gov/api/citations/20180007412/downloads/20180007412.pdf"
    - date: "Nov 2018"
      what: "NASA's Stirling controllers rectify the alternator output to DC and modulate the load to hold a set output voltage. The engineering-model controllers fed 22–36 V spacecraft buses for radioisotope generators."
      title: "Dugala, NASA/TM-2018-219963: Stirling convertor controller development at NASA Glenn"
      url: "https://ntrs.nasa.gov/api/citations/20180008496/downloads/20180008496.pdf"
    - date: "Jan 2020"
      what: "A NASA-funded study of 1200 V silicon carbide power MOSFETs finds that derating the voltage by 50% does not remove the risk of heavy-ion single-event burnout."
      title: "Austin et al., IEEE TNS: Inclusion of radiation environment variability for reliability estimates for SiC power MOSFETs"
      url: "https://ntrs.nasa.gov/api/citations/20205000795/downloads/2020-561-Austin-Final-Paper-TNS.pdf"
    - date: "Apr 2022"
      what: "NASA Glenn's lunar power overview: Artemis-era links of 1–3 km to users at elevated voltage (2 kV and above); the ISRU plant needs power over 3–5 km; the tethered power project lists 'Fission Surface Power and Surface Solar Power • 1 km • 10 kW'."
      title: "Csank & Scott, Power and Energy for the Lunar Surface"
      url: "https://ntrs.nasa.gov/api/citations/20220005893/downloads/Power%20and%20Energy%20for%20the%20Lunar%20Surface.pdf"
    - date: "Aug 2022"
      what: "NASA's grid study picks 3 kV AC and finds 1 kHz the lightest. For 100 kW on 8 AWG cable at 1 kHz, 3 kV works to about 600 m, 6 kV to 2.5 km and 18 kV to 20 km; longer grids beyond Artemis may need a lower frequency."
      title: "Thomas, Granger, Csank & Gardner, Establishing a Lunar Surface Power Grid (APS4DS 2022)"
      url: "https://ntrs.nasa.gov/api/citations/20220011587/downloads/APS4DS_Establishing_Lunar_Grid_V3.pdf"
    - date: "2025"
      what: "NASA/DOE's reactor reference design: 3 kVac, 1 kHz transmission over 1 km; 325 kg for the main 1 km cable and spool; burying the cable is not advised."
      title: "Mason et al., Key Design Trades for a Near-term Lunar Fission Surface Power System (NETS 2025)"
      url: "https://ntrs.nasa.gov/citations/20250000841"
    - date: "Sep 2025"
      what: "NASA's reference PMAD: Brayton alternators give 240 Vrms, 2 kHz, 3-phase straight to a transformer; Stirling controllers give 350 V DC, then DC-to-AC and a transformer to 3 kVac. AC 'allows use of existing flight-rated switches without stacking'."
      title: "INL/NASA: Fission Surface Power Technical Maturation Webinar"
      url: "https://inl.gov/content/uploads/2024/11/FSP-Technical-Maturation-Webinar-Final-250924-1.pdf"
    - date: "Dec 2025"
      what: "NASA tests high-voltage AC cables in vacuum with regolith simulant and finds no major losses; frequency did not change the results."
      title: "Klopp, Thomas & Csank, An Experimental Study of Losses in High Voltage AC Lunar Power Cables (SciTech 2026)"
      url: "https://ntrs.nasa.gov/citations/20250011012"
    - date: "Sep 2026"
      what: "NASA's LR-1 requirement is 3 kV RMS AC at the output. The requirements do not set the frequency."
      title: "NASA Glenn, SPARC Industry Day presentation (LR-1 requirements)"
      url: "https://sam.gov/api/prod/opps/v3/opportunities/resources/files/6b927f8dc6c843749a45b2c0589bf0e7/download"
  quotes:
    - text: "DC grid practically limited to 1.2-1.5 kV, due to lack of high voltage rad-hard switches"
      src: "NASA, Establishing a Lunar Surface Power Grid (2022)"
      url: "https://ntrs.nasa.gov/api/citations/20220011587/downloads/APS4DS_Establishing_Lunar_Grid_V3.pdf"
    - text: "Long distances beyond Artemis may require dropping to lower frequency (TBD) to avoid stability, propagation issues"
      src: "NASA, Establishing a Lunar Surface Power Grid (2022)"
      url: "https://ntrs.nasa.gov/api/citations/20220011587/downloads/APS4DS_Establishing_Lunar_Grid_V3.pdf"
    - text: "1-3 km power transmission to users. Elevated voltage (2 kV+) proposed."
      src: "Csank & Scott, NASA Glenn (2022)"
      url: "https://ntrs.nasa.gov/api/citations/20220005893/downloads/Power%20and%20Energy%20for%20the%20Lunar%20Surface.pdf"
    - text: "Power is needed over long distances (3-5 km)"
      src: "Csank & Scott, NASA Glenn (2022), on ISRU"
      url: "https://ntrs.nasa.gov/api/citations/20220005893/downloads/Power%20and%20Energy%20for%20the%20Lunar%20Surface.pdf"
    - text: "the controller rectifies the alternator output and then modulates the applied load to maintain a specified output voltage"
      src: "NASA/TM-2018-219963"
      url: "https://ntrs.nasa.gov/api/citations/20180008496/downloads/20180008496.pdf"
    - text: "derating the operating voltage by 50% does not eliminate the risk of SEB"
      src: "Austin et al., IEEE TNS (2020)"
      url: "https://ntrs.nasa.gov/api/citations/20205000795/downloads/2020-561-Austin-Final-Paper-TNS.pdf"
  tradeoffs:
    - "Siting is constrained. The base, and its PMC, must sit within 3 km of cable run of every VSAT ridge point. That may cut combined illumination: M00 and C04.2 cite two Shackleton-ridge points about 8 km apart lit a combined ~94% of the year, and both cannot be within 3 km of one PMC. Site selection (M00) must resolve this (open)."
    - "The ISRU and oxygen plants must also be within 3 km of cable run of the PMC, against NASA's estimate that ISRU needs power over 3–5 km (open)."
    - "Ice mining in permanently shadowed regions more than 3 km from the PMC must use the mobile power cart (PBS PW.5) or a local source (open)."
    - "Every source carries its own inverter and transformer. That adds mass and boxes at each tower and each reactor; the mass sits inside M04's existing converter and grid hardware items until the load budget sizes it (open). No cost line changes."
    - "1 kHz is kept because 3 km is within NASA's design scale. Longer runs would need higher voltage or a lower frequency, which is why they are rejected for now."
    - "LR-1's alternator frequency is not set by NASA, and NASA's 2025 Brayton reference ran at 2 kHz. A 1 kHz output must be specified to the vendor or added as a frequency converter at the reactor end (open)."

- id: DD-014
  date: "2026-11-18"
  title: "Power runs: 3 km stays the standard; extended runs of up to 10 km are allowed at about 10–15% transmission loss"
  status: "Adopted; each extended run needs a 1 kHz stability analysis before approval (open)"
  affects: [M00, M04, M06, C04.1, C04.2, C04.3, C04.4, C06.1, C06.2, C07.1, kilopower-krusty-fission-test, us-lunar-reactor-1-sparc, vertical-solar-array-technology-vsat, lunar-ac-power-transmission, astrobotic-lunagrid-lite, roadmap, pbs]
  was: "DD-013 capped every power run at 3 km of cable from a generation source to the PMC. Runs of 10–30 km were rejected. That ruled out the Shackleton-ridge point pair about 8 km apart (~94% combined light) and ISRU plants at NASA's 3–5 km distance; work beyond 3 km went to the mobile power cart (PBS PW.5)."
  now: "1) 3 km stays the standard power run from a generation source to the PMC. 2) Extended runs of up to 10 km are allowed, at about 10–15% transmission loss. Beyond 10 km is still rejected. 3) Where 10–15% comes from (this plan's arithmetic): the DD-013 worst-case link is 20 kW at 3 kV, 3-phase, unity power factor, 3.85 A per phase, aluminium at 26.5 nΩ·m, with the conductor sized for 3% loss at 3 km (~5.9 mm² per phase). On the same cable, 3 km is ~13.5 Ω per conductor, ~0.6 kW loss (~3%) and ~3% voltage drop; 10 km is ~45 Ω, ~2.0 kW (~10%) and ~10% voltage drop. On NASA's 8 AWG reference size (8.37 mm²) the loss goes from about 2.1% at 3 km to about 7% at 10 km. The upper end, up to ~15%, is plan margin (ESTIMATE) for two effects not in that table: the current rises a little as the voltage sags, and the 1 kHz reactive effects (cable charging current and inductance) are not quantified, because NASA has not published them for this cable. 4) Conditions for every extended run (plan design): voltage regulation or transformer taps at the receiving end for the ~10% sag; an analysis of 1 kHz cable charging and stability for that run before it is approved; optionally a thicker cable to cut the loss. At constant loss, cable mass rises with the square of distance: about 1.6 t of aluminium for 3% at 10 km (this plan's arithmetic). 5) What this unblocks (plan design): the Shackleton-ridge pair about 8 km apart can be reached with extended runs, if at least one point is within 10 km and each run is 10 km or less; ISRU plants at 3–5 km can run on grid power as extended runs; the mobile power cart (PW.5) is now for work beyond 10 km."
  why: "The user's decision. The 3 km cap cost the base its best published pair of ridge points and put ISRU plants closer than NASA expects them to be. On the DD-013 cable, a 10 km run loses about 10% (this plan's arithmetic), which the generation budget can carry. NASA's grid study warns that 'long distances beyond Artemis may require dropping to lower frequency (TBD) to avoid stability, propagation issues', so each extended run must pass its own 1 kHz stability check, and 3 km stays the standard."
  timeline:
    - date: "Apr 2022"
      what: "NASA Glenn's lunar power overview: Artemis-era links of 1–3 km at 2 kV and above; ISRU needs power over 3–5 km."
      title: "Csank & Scott, Power and Energy for the Lunar Surface"
      url: "https://ntrs.nasa.gov/api/citations/20220005893/downloads/Power%20and%20Energy%20for%20the%20Lunar%20Surface.pdf"
    - date: "Aug 2022"
      what: "NASA's grid study: for 100 kW on 8 AWG cable at 1 kHz, 3 kV works to about 600 m, 6 kV to 2.5 km and 18 kV to 20 km. Long distances beyond Artemis may need a lower frequency to avoid stability and propagation issues."
      title: "Thomas, Granger, Csank & Gardner, Establishing a Lunar Surface Power Grid (APS4DS 2022)"
      url: "https://ntrs.nasa.gov/api/citations/20220011587/downloads/APS4DS_Establishing_Lunar_Grid_V3.pdf"
    - date: "2025"
      what: "NASA/DOE's reactor reference design: 3 kVac, 1 kHz over 1 km; 325 kg for the main 1 km cable and spool."
      title: "Mason et al., Key Design Trades for a Near-term Lunar Fission Surface Power System (NETS 2025)"
      url: "https://ntrs.nasa.gov/citations/20250000841"
    - date: "Aug 2025"
      what: "Astrobotic's LunaGrid-Lite passes critical design review; it lays 500 m of cable and transmits 1 kW."
      title: "Astrobotic: LunaGrid-Lite completes critical design review, flight model underway"
      url: "https://www.astrobotic.com/lunagrid-lite-completes-critical-design-review-flight-model-underway/"
    - date: "Dec 2025"
      what: "NASA tests high-voltage AC cables in vacuum with regolith simulant and finds no major losses; frequency did not change the results."
      title: "Klopp, Thomas & Csank, An Experimental Study of Losses in High Voltage AC Lunar Power Cables (SciTech 2026)"
      url: "https://ntrs.nasa.gov/citations/20250011012"
    - date: "2026"
      what: "Aluminium resistivity 26.5 nΩ·m and density 2,699 kg/m³, the values behind this plan's loss and mass arithmetic."
      title: "Wikipedia: Aluminium"
      url: "https://en.wikipedia.org/wiki/Aluminium"
  quotes:
    - text: "Long distances beyond Artemis may require dropping to lower frequency (TBD) to avoid stability, propagation issues"
      src: "NASA, Establishing a Lunar Surface Power Grid (2022)"
      url: "https://ntrs.nasa.gov/api/citations/20220011587/downloads/APS4DS_Establishing_Lunar_Grid_V3.pdf"
    - text: "Power is needed over long distances (3-5 km)"
      src: "Csank & Scott, NASA Glenn (2022), on ISRU"
      url: "https://ntrs.nasa.gov/api/citations/20220005893/downloads/Power%20and%20Energy%20for%20the%20Lunar%20Surface.pdf"
  tradeoffs:
    - "Loss: an extended run wastes about 10–15% of what it carries (this plan's arithmetic and ESTIMATE), against ~3% on a standard run. The generation budget must make that up; for 20 kW over 10 km that is about 2 kW more at the source (this plan's arithmetic)."
    - "Voltage: the ~10% sag at 10 km needs voltage regulation or transformer taps at the receiving end (plan design)."
    - "Stability: 10 km is beyond NASA's 1–3 km Artemis scale and well beyond the ~600 m NASA's study gives for 100 kW on 8 AWG at 3 kV. NASA has not published 1 kHz charging and stability data for such a run, so each one needs its own analysis before approval (open)."
    - "Mass: a 10 km run is more cable. At NASA's planning figure of 325 kg per 1 km main cable and spool, it is about 3.3 t against about 1 t for 3 km (this plan's arithmetic). Holding 3% loss instead needs about 1.6 t of aluminium alone (this plan's arithmetic). That mass sits inside M04's existing grid hardware and delivery items until the load budget sizes it; no cost line changes."
    - "Laying: the cable rover must lay longer runs. LunaGrid-Lite's 2025 design lays about 500 m, so a 10 km run is many spool loads (open)."

- id: DD-015
  date: "2026-11-18"
  title: "Base sites: primary on the north rim of de Gerlache (Circle 1), backup on the Connecting ridge by Shackleton (Circle 2)"
  status: "Adopted; to be confirmed by M01 ground prospecting"
  affects: [M00, M01, M04, M06, C06.2, roadmap]
  was: "The site search had a focus area (DD-010) but no chosen base site."
  now: "Primary base site: 88.445°S, 63.44°W, on the north rim of de Gerlache inside NASA's de Gerlache Rim 2 region (Circle 1). Backup: 89.559°S, 163.66°W, on the Connecting ridge by Shackleton's west rim (Circle 2). Both were picked by the user on the M00 combined map. The primary's ice-mining power comes from VSATs on the de Gerlache rim within 10 km of the crater's shadowed floor (see M00)."
  why: "The user's decision. Circle 1 is inside a NASA-screened candidate region, on 5° ground with 65% of the land within 1 km at 8° or less, 7.7 km from site 5 (82.7% sunlit), 12.7 km from de Gerlache's ice-candidate floor and the closer of the two to the LEND hydrogen zone (19.9 km). Circle 2 has the best power in the focus area (the Connecting ridge trio, about 93% combined, ESTIMATE) and is 5.2 km from Shackleton's floor, so it is a strong, independent fallback 51.2 km away (corrected from about 44 km, Nov 2026)."
  timeline:
    - date: "Oct 2024"
      what: "NASA lists de Gerlache Rim 2 among its nine candidate regions; Circle 1 lies inside it."
      title: "NASA: NASA Provides Update on Artemis III Moon Landing Regions"
      url: "https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/"
    - date: "2011"
      what: "NASA GSFC average illumination maps used to rank VSAT sites around both circles."
      title: "NASA GSFC PGDA: Lunar Polar Illumination (Mazarico et al. 2011)"
      url: "https://pgda.gsfc.nasa.gov/products/69"
    - date: "2023"
      what: "NASA GSFC LOLA slope and permanently shadowed region maps used for landing ground and ice-candidate distances."
      title: "NASA GSFC PGDA: A New View of the Lunar South Pole from LOLA (Barker et al. 2023)"
      url: "https://pgda.gsfc.nasa.gov/products/90"
    - date: "Jan 2024"
      what: "NASA-funded work maps a young fault scarp in de Gerlache Rim 2, which pads and habitats at Circle 1 must avoid."
      title: "NASA: Shrinking Moon causing moonquakes and faults near lunar south pole"
      url: "https://www.nasa.gov/solar-system/moon/shrinking-moon-causing-moonquakes-and-faults-near-lunar-south-pole/"
  tradeoffs:
    - "Weaker power than the backup: about 85% combined sunlight with four VSATs and blackouts up to about 6 days at the primary, against about 93% on the ridge (ESTIMATE)."
    - "The ice-candidate floor is 12.7 km from the base, beyond the 10 km extended-run limit (DD-014), so ice mining is powered from rim VSATs nearer the floor, not from the base grid directly."
    - "A young fault scarp is mapped in de Gerlache Rim 2; pads and habitats must stay clear of it."
    - "Ice at de Gerlache is unconfirmed (one M3 spectrum and a ShadowCam bright spot); M01 must measure it before the base is committed."

- id: DD-016
  date: "2026-11-18"
  title: "Isolated grids: the ice mine has its own VSATs, PMC and grid on the de Gerlache rim, separate from the base grid"
  status: "Adopted"
  affects: [M00, M04, M06, C04.3, C04.4, C06.2, pbs]
  was: "DD-009 made one base-wide grid with no separate habitat or ISRU microgrids; the ice mine would draw power from the base grid over an extended run (DD-014), or from the mobile power cart."
  now: "The base keeps one grid (DD-009). A remote site may run its own isolated grid with its own generation, PMC and storage, not connected to the base grid. First case: the ice mine at the edge of de Gerlache's shadowed floor is powered by two 10 kW VSATs on the crater rim (88.4657°S, 67.87°W and 88.3937°S, 68.69°W, 2.3 km apart) feeding a mine PMC on the rim, with an 8.3 km feeder down to the mine. The base is powered by its own VSATs: first site 5 (88.6652°S, 68.42°W, 7.7 km) and a second tower at 88.7108°S, 68.28°W (8.8 km)."
  why: "The user's decision. The base and the mine are 12.7 km apart, beyond the 10 km run limit, so one grid cannot serve both. Separate grids keep every source run short (the mine VSATs are 2.3 km apart) and let each site be sized for its own load; a fault on one grid does not take down the other."
  timeline:
    - date: "Aug 2022"
      what: "NASA Glenn's lunar grid study planned separate habitat and ISRU microgrids joined by a 3 kV AC trunk; DD-016 returns to separate grids for remote sites, without the trunk."
      title: "Thomas, Granger, Csank & Gardner, Establishing a Lunar Surface Power Grid"
      url: "https://ntrs.nasa.gov/citations/20220011587"
    - date: "2011"
      what: "NASA GSFC average illumination map used to pick the VSAT sites for each grid."
      title: "NASA GSFC PGDA: Lunar Polar Illumination (Mazarico et al. 2011)"
      url: "https://pgda.gsfc.nasa.gov/products/69"
  tradeoffs:
    - "No power sharing: the base cannot help the mine, or the mine the base, unless a tie line is added later (open)."
    - "Two PMCs, two storage banks and two sets of spares instead of one."
    - "The mine grid's two VSATs are lit 77.4% of the time together and both go dark for up to about 14 days (ESTIMATE). The mine shuts down when both are dark; its storage only keeps systems minimally alive (heaters, controls, comms), not the mining load (plan design)."
    - "The base's two VSATs are lit about 84.1% together, with blackouts up to about 6 days (ESTIMATE); adding two more nearby adds under 1 point."

- id: DD-017
  date: "2026-11-18"
  title: "Base VSAT B3 near the base for redundancy and faster battery charging"
  status: "Adopted"
  affects: [M00, M04]
  was: "The base grid had two VSATs on long runs: B1 at site 5 (7.7 km) and B2 (8.8 km) (DD-016)."
  now: "A third base VSAT, B3, stands 0.8 km from the base at 88.4411°S, 62.44°W on flat ground (about 1° slope), on a standard run. Its job is redundancy (the base keeps solar power if B1 or B2 or their long cables fail) and faster battery charging while the Sun is up. It is not meant to add hours of sunlight."
  why: "The user's decision. Tests of up to five VSATs within 3 km showed they cannot replace the long-run pair (56.9% against 84.1% combined sunlight) and do not shorten the 6.2-day longest blackout (M00, ESTIMATE). B3 is the best-lit spot within 3 km (50.4% on NASA's map, 48.7% Open Moon estimate). It is lit during 57.7% of the time B1 or B2 is lit, adding about 4,250 hours a year of extra charging power, and almost never when both are dark (about 11 hours a year)."
  timeline:
    - date: "2011"
      what: "NASA GSFC average illumination map used to pick B3 as the best-lit spot within 3 km of the base."
      title: "NASA GSFC PGDA: Lunar Polar Illumination (Mazarico et al. 2011)"
      url: "https://pgda.gsfc.nasa.gov/products/69"
    - date: "2023"
      what: "NASA GSFC LOLA slope map: B3's spot is about 1° with no slope above 7.2° within 100 m."
      title: "NASA GSFC PGDA: A New View of the Lunar South Pole from LOLA (Barker et al. 2023)"
      url: "https://pgda.gsfc.nasa.gov/products/90"
  tradeoffs:
    - "One more 10 kW tower to fly and maintain, inside M04's provisional count of 10 towers (DD-004)."
    - "B3 adds about 0.3 points of combined sunlight (84.1% to about 84.4%, ESTIMATE); its value is charging rate and redundancy, not uptime."
    - "Battery chargers and the PMC must accept the extra peak input while all three towers are lit (sizing open)."


- id: DD-018
  date: "2026-11-18"
  title: "Open Moon is a proposal for how the United States should build a self-sustaining Moon colony; M00 is site selection only"
  status: "Adopted"
  affects: [M00, M02]
  was: "M00 was titled 'Programme set-up and site selection'. It included setting up an open-source programme, legal and partner work, and notifying other operators. Pages treated Open Moon as its own operator that might land near NASA's Moon Base and partner with it for crew seats."
  now: "Open Moon is a hypothetical proposal, written as an advocacy tool, for how the United States should build a self-sustaining Moon colony and what NASA's Moon Base should be. There is no Open Moon programme or organisation, and the base does not land beside NASA's base or work with it. M00 is 'Site selection', inside Phase 0, 'Site selection and preparation'. The programme and legal workstream and its cost item are removed. Crew come on NASA Artemis crew flights or commercial HLS seats, not through a partnership with NASA."
  why: "The user's decision: this is their plan for how the USA should create a self-sustaining Moon colony, a proposal and lobbying tool, not a separate programme."
  timeline:
    - date: "Mar 2026"
      what: "NASA describes its own Moon Base phases; Open Moon is written as an alternative design for that base."
      title: "NASA Moon Base – Phases"
      url: "https://www.nasa.gov/moonbase-phases/"
  tradeoffs:
    - "M00 cost falls from $0.05–0.15B to $0.045–0.13B (the legal and coordination item is removed)."
    - "Notice under the Artemis Accords becomes NASA's job as the agency carrying out the plan, not a separate Open Moon step."

- id: DD-019
  date: "2026-11-18"
  title: "Site selection is done; Year 0 is the first landers, for scouting and site preparation"
  status: "Adopted"
  affects: [M00, M01, M02, M03, M04, M05, roadmap]
  was: "Year 0 (2026) was the site search, Year 1 (2027) site certification and contracts, Year 2 (2028) the prospector landings, and Year 3 (2029) the go decision, first solar tower and excavation."
  now: "Site selection (M00) was finished in November 2026, before Year 0, from orbital data alone (DD-015). Year 0 (2027–2029) merges the old Years 1–3: rides and relay service booked, two prospector rovers launched and landed to drill for ice, the go / no-go on the site, the first 10 kW solar tower, the first cable and comms, and excavators grading the first pad. Later years keep their numbers."
  why: "The user's decision: the site search is done, and the plan starts with landers going to the Moon to scout and prepare the site."
  timeline:
    - date: "Nov 2026"
      what: "Primary and backup base sites chosen on the M00 combined map (DD-015)."
      title: "Open Moon M00: Site selection"
      url: "https://openmoon.beached.lol/plan/m00-site-selection/"
  tradeoffs:
    - "Year 0 now spans three calendar years (2027–2029), so it is longer than any other roadmap stage."
    - "Open checks from site selection (boulder counts, NAC pad hazard maps, Earth-visibility hours) move into Year 0 work under M01, M03 and M05."
