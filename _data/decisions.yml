- id: DD-001
  date: "2026-11-18"
  title: "Lunar power grid: switch from ±4 kV DC to 3 kV AC, 3-phase, 1 kHz"
  status: Adopted
  affects: [M04, C04.4, C04.1, C04.2, C07.1, C08.1]
  was: "±4 kV DC transmission trunk with stacked DC–DC converters at every source and user."
  now: "3 kV AC, 3-phase, 1 kHz transmission trunk. Transformers step voltage up and down, and Universal Modular Interface Converters (UMICs) connect 120 V DC equipment and microgrids to it."
  why: "To match NASA's own lunar grid baseline, which NASA chose because DC cannot yet be raised to the needed voltage with radiation-hard parts."
  note: "DD-009 (Nov 2026) keeps this trunk but drops the separate microgrids: the base grid is one 3 kV AC distribution network, and every unit has its own service connection with a UMIC-class converter that delivers 120 V DC to its panel."
  timeline:
    - date: "Feb 2022"
      what: "NASA Glenn reviews lunar power transmission for the 40 kW Fission Surface Power system. It finds high-voltage metal cable the best option and lays out the AC and DC hardware challenges, but states it is not a NASA preference. Open Moon's original ±4 kV DC choice came from this paper."
      title: "Barth & Pike, Lunar Power Transmission for Fission Surface Power (NETS-2022)"
      url: "https://ntrs.nasa.gov/citations/20220002315"
    - date: "Aug 2022"
      what: "NASA Glenn's grid trade study compares 1.2–6 kV, DC and 3-phase AC, at 60 Hz to 1 kHz. It finds 1 kHz the lightest AC option and selects 3 kV AC as the mass-optimal feasible design."
      title: "Thomas, Granger, Csank & Gardner, Establishing a Lunar Surface Power Grid (APS4DS 2022)"
      url: "https://ntrs.nasa.gov/citations/20220011587"
    - date: "Sep 2023"
      what: "NASA publishes the Universal Modular Interface Converter (UMIC), which connects 120 V DC space equipment to a 3 kV AC grid at 1 kHz. It is built from standard 1 kW inverter modules, with targets of over 85% transmission efficiency and under 0.55 kg/m."
      title: "Thomas et al., A Modular AC to DC Interface Converter to Enable Lunar Surface Power Transmission (AIAA ASCEND 2023)"
      url: "https://ntrs.nasa.gov/citations/20230013309"
    - date: "2025"
      what: "NASA/DOE's government reference design for a 40 kWe lunar fission system uses a 3 kVac, 1 kHz link to a user interface 1 km away. NASA says it was selected to leverage the UMIC, and that AC offered advantages over DC for this application."
      title: "Mason et al., Key Design Trades for a Near-term Lunar Fission Surface Power System (NETS 2025)"
      url: "https://ntrs.nasa.gov/citations/20250000841"
    - date: "Dec 2025"
      what: "NASA tests AC power cables at several frequencies in vacuum with lunar regolith simulant, coiled, buried and separated. It finds no major losses from the regolith, and the choice of frequency did not change the results."
      title: "Klopp, Thomas & Csank, An Experimental Study of Losses in High Voltage AC Lunar Power Cables (SciTech 2026)"
      url: "https://ntrs.nasa.gov/citations/20250011012"
  quotes:
    - text: "DC grid practically limited to 1.2-1.5 kV, due to lack of high voltage rad-hard switches"
      src: "NASA, Establishing a Lunar Surface Power Grid (2022), trade study conclusions"
      url: "https://ntrs.nasa.gov/citations/20220011587"
    - text: "AC easier to increase voltage and expand, as transformers can change voltage in AC-DC designs … These facts drove team to select AC"
      src: "NASA, Establishing a Lunar Surface Power Grid (2022)"
      url: "https://ntrs.nasa.gov/citations/20220011587"
    - text: "1 kHz had lowest mass"
      src: "NASA, Establishing a Lunar Surface Power Grid (2022), radial architecture results"
      url: "https://ntrs.nasa.gov/citations/20220011587"
    - text: "The 3 kVac, 1 kHz long-distance power transmission approach was selected to leverage the Universal Modular Interface Converter (UMIC) technology"
      src: "NASA, Key Design Trades for a Near-term Lunar Fission Surface Power System (NETS 2025)"
      url: "https://ntrs.nasa.gov/citations/20250000841"
    - text: "Reducing the transmission voltage from 3 kVac to 1 kVac resulted in a 1442 kg user interface pallet, an increase of 570 kg … There was no mass benefit to increasing the voltage above 3 kVac"
      src: "NASA, Key Design Trades for a Near-term Lunar Fission Surface Power System (NETS 2025)"
      url: "https://ntrs.nasa.gov/citations/20250000841"
  tradeoffs:
    - "NASA's own study says DC transmission is significantly lighter than AC above 3–4 kV. Open Moon accepts heavier cable to use parts that can actually be built and radiation-qualified."
    - "NASA's 2025 reference lists 325 kg for a 1 km main cable and spool. This is heavier than the ~240 kg per 3 km DC cable Open Moon assumed before, so M04's grid delivery mass rises from ~1 t to ~2 t."
    - "NASA notes that much longer grids beyond Artemis scale may need a lower frequency to avoid stability and propagation problems. The 3 kV, 1 kHz choice suits links of a few kilometres."
    - "The Brayton option's 3-phase alternators can feed the 3 kVac step-up transformer directly. Stirling alternators need an extra converter stage: NASA gives about 90% PMAD efficiency for Brayton against 83% for Stirling."
- id: DD-002
  date: "2026-11-18"
  title: "Fission power: KRUSTY-class or 20 kWe LR-1-class reactors that only charge batteries (Reactor > BMS > Battery > Base)"
  status: "Reactor choice adopted; power routing superseded by DD-003"
  affects: [M04, C04.1, C04.3, C04.4, M10, C10.1, M11, kilopower-krusty-fission-test, us-lunar-reactor-1-sparc]
  was: "One 40 kWe-class reactor, sized from NASA's 2022 and 2025 reference designs (about 7–10 t), feeding the 3 kV AC grid directly. The grid accepted any 20–100 kWe unit."
  now: "Two reactor types only: a KRUSTY-class Kilopower unit (plan value 1 kWe, Stirling) for small loads, and an LR-1-class unit (plan value 20 kWe, closed Brayton, 3 kV AC) for the base. Every reactor charges a battery through a charger and battery management system (BMS); the base draws its fission power only from that battery bus. Each 20 kWe unit gets a 160 kWh battery string (8 hours at full output, enough to ride through one reactor restart)."
  why: "These are the two fission systems with real hardware or a real purchase behind them: KRUSTY was the first space reactor nuclear test in over 50 years, and LR-1 is the only reactor NASA is buying. Running the reactor at steady output into a battery suits both converters, lets the battery take the base's peaks, and matches LR-1's required 0–100% load range and parasitic load radiator."
  note: "DD-008 (Nov 2026) renamed the terms. The 'charger and BMS' here are now the PMC and the battery charge/discharge units (BCDUs); BMS now means only each battery string's cell management system."
  timeline:
    - date: "Mar 2018"
      what: "KRUSTY runs for 28 hours on nuclear power. The reactor follows every load change by itself and NASA rates it TRL 5. It is a prototype of the 1 kWe Kilopower flight design."
      title: "Gibson et al., KRUSTY nuclear ground test results and lessons learned (NTRS 20180005435)"
      url: "https://ntrs.nasa.gov/citations/20180005435"
    - date: "2022"
      what: "NASA's 40 kWe lunar Stirling concept dumps unused power into a resistor bank or radiator, because Stirling engines need a constant electrical load, and carries a 4 kWh Li-ion start-up battery."
      title: "Oleson et al., A Deployable 40 kWe Lunar Fission Surface Power Concept (NETS 2022)"
      url: "https://ntrs.nasa.gov/citations/20220004670"
    - date: "Aug 2025"
      what: "NASA asks industry for a reactor of at least 100 kWe with closed Brayton conversion."
      title: "NASA seeks industry feedback on fission surface power"
      url: "https://www.nasa.gov/centers-and-facilities/glenn/nasa-seeks-industry-feedback-on-fission-surface-power/"
    - date: "Sep 2026"
      what: "NASA's SPARC Industry Day sets Lunar Reactor-1: at least 20 kWe at 3 kV RMS AC after a single failure, HALEU, closed Brayton, a user load from 0 to 100% of output, and startup into a parasitic load radiator."
      title: "NASA Glenn, SPARC Industry Day presentation (LR-1 requirements)"
      url: "https://sam.gov/api/prod/opps/v3/opportunities/resources/files/6b927f8dc6c843749a45b2c0589bf0e7/download"
  quotes:
    - text: "LR-1 output is no less than 20 kWe at 3 kVRMS"
      src: "NASA Glenn, SPARC Industry Day (2026)"
      url: "https://sam.gov/api/prod/opps/v3/opportunities/resources/files/6b927f8dc6c843749a45b2c0589bf0e7/download"
    - text: "Accommodates a user load that varies from 0 to 100% of rated electrical output"
      src: "NASA Glenn, SPARC Industry Day (2026), LR-1 flight system requirements"
      url: "https://sam.gov/api/prod/opps/v3/opportunities/resources/files/6b927f8dc6c843749a45b2c0589bf0e7/download"
    - text: "Perform a controlled startup to achieve a stable operating condition with electric power shunted by a Parasitic Load Radiator."
      src: "NASA Glenn, SPARC Industry Day (2026), LR-1 notional ConOps"
      url: "https://sam.gov/api/prod/opps/v3/opportunities/resources/files/6b927f8dc6c843749a45b2c0589bf0e7/download"
  tradeoffs:
    - "Half the fission power per unit: one LR-1-class unit gives 20 kWe against the 40 kWe the plan assumed. M04's fission share drops to 20 kWe, and later milestones need more units (three for the M10 greenhouses, two more in M11)."
    - "Delivery mass per unit is uncertain. No LR-1 design exists; the plan uses 7.5 t (NASA's 2025 40 kWe Brayton reference) to 15 t (LR-1's mass cap), which widens the cost ranges of M04, M10 and M11."
    - "The charger, BMS and battery carry every watt of fission power, so they become critical equipment. The plan uses at least two independent battery strings per reactor so one fault cannot cut the base off."
    - "Charging and discharging lose some energy, and each 20 kWe unit adds about 1 t of Li-ion battery (160 kWh at 160 Wh/kg)."
    - "A KRUSTY-class unit has no flight programme. Only a DARPA–Los Alamos ground-test agreement (Oct 2026) is active, so the 1 kWe option may not be available."
- id: DD-003
  date: "2026-11-18"
  title: "Base power architecture: every source feeds the BMS, which routes power to the grid, to storage, or both"
  status: Adopted
  affects: [M04, C04.1, C04.2, C04.3, C04.4, M10, M11, C08.1, kilopower-krusty-fission-test, us-lunar-reactor-1-sparc, vertical-solar-array-technology-vsat, astrobotic-vsat-xl, lunar-ac-power-transmission]
  was: "DD-002: reactors only charged a battery and the base drew fission power only from that battery. Solar towers and storage fed the 3 kV AC grid directly."
  now: "The power system has inputs, storage and outputs, with the BMS in the middle. Inputs (fission reactors, solar towers) always send their power to the BMS. The BMS decides, moment to moment, whether that power goes to the grid to meet demand, into storage (Li-ion battery bank, then regenerative fuel cells), or some of each, and feeds the grid from the battery when generation falls short. The grid is fed only by generation passing through the BMS, or by the battery. The regenerative fuel cells never feed the grid directly: when they discharge, they recharge the battery through the BMS. In this plan, BMS means this base power management and routing system; it includes the battery cell management. Default routing: meet demand by priority; charge the battery with surplus; then the fuel-cell electrolyser; then curtail solar and dump reactor surplus to its parasitic load radiator. When short: the battery feeds the grid, the fuel cells recharge the battery, and loads are shed by priority as a last resort."
  why: "One controller that sees every source, every store and every load can match supply to demand and keep storage charged, instead of separate chains that cannot share. It lets reactor power reach the base without a round trip through the battery, lets solar charge the same battery, and lets spare reactor power fill the fuel-cell storage. NASA's own lunar grid concept already uses a controller that routes power to the highest-priority loads, and LR-1 is required to accept any load from 0 to 100%."
  note: "DD-008 (Nov 2026) renamed the hub described here from BMS to the power management controller (PMC), with PMC main switching units A and B; BMS now means only battery cell management. The routing rules are unchanged. DD-009 replaced the habitat and ISRU microgrids with one grid and a service connection per unit."
  timeline:
    - date: "Apr 2022"
      what: "NASA Glenn describes lunar microgrids with a regional controller that sends power to the highest-priority loads first, such as the crewed habitat."
      title: "Csank & Scott, Power and Energy for the Lunar Surface"
      url: "https://ntrs.nasa.gov/api/citations/20220005893/downloads/Power%20and%20Energy%20for%20the%20Lunar%20Surface.pdf"
    - date: "Aug 2022"
      what: "NASA Glenn's lunar grid trade study selects a 3 kV AC trunk joining separate habitat and ISRU microgrids."
      title: "Thomas, Granger, Csank & Gardner, Establishing a Lunar Surface Power Grid"
      url: "https://ntrs.nasa.gov/citations/20220011587"
    - date: "Sep 2023"
      what: "NASA publishes the UMIC, a modular bidirectional converter between 120 V DC equipment and the 3 kV AC grid, with droop control for load sharing."
      title: "Thomas et al., A Modular AC to DC Interface Converter (UMIC)"
      url: "https://ntrs.nasa.gov/citations/20230013309"
    - date: "Sep 2026"
      what: "NASA's LR-1 requirements: accept a user load from 0 to 100% of rated output, and start up into a parasitic load radiator."
      title: "NASA Glenn, SPARC Industry Day presentation (LR-1 requirements)"
      url: "https://sam.gov/api/prod/opps/v3/opportunities/resources/files/6b927f8dc6c843749a45b2c0589bf0e7/download"
  quotes:
    - text: "Accommodates a user load that varies from 0 to 100% of rated electrical output"
      src: "NASA Glenn, SPARC Industry Day (2026), LR-1 flight system requirements"
      url: "https://sam.gov/api/prod/opps/v3/opportunities/resources/files/6b927f8dc6c843749a45b2c0589bf0e7/download"
  tradeoffs:
    - "The BMS becomes the single most critical piece of power equipment: every watt passes through it. The plan splits it into two independent halves (A and B) with a cross-tie, each able to carry the essential loads, and keeps the battery in at least two strings."
    - "All source cables run to the BMS hub instead of to the nearest user, which can add cable length for sources far from the hub."
    - "Every conversion step loses some energy. Power routed straight to the grid avoids the battery round trip that DD-002 required, but each source still passes through the BMS converters."
    - "The BMS software decides priorities for the whole base. It must keep working through communication gaps with Earth and be testable on the ground before flight."
    - "The name BMS usually means only battery cell management. In this plan it means the whole routing system; industry often calls this an energy management system or power management and distribution (PMAD)."
- id: DD-004
  date: "2026-11-18"
  title: "Solar towers: NASA's 10 kW VSAT only; number set by the Phase 1 load budget"
  status: Adopted
  affects: [M04, C04.2, C04.3, C04.4, M11, vertical-solar-array-technology-vsat, astrobotic-vsat-xl]
  was: "M04 planned two 10 kW VSATs plus two 50 kW Astrobotic VSAT-XL towers, for at least 100 kW of solar peak power."
  now: "The plan uses only the 10 kW-class Vertical Solar Array Technology (VSAT) towers that NASA is developing. VSAT-XL is dropped and kept only as an alternative. The number of VSATs, and where they stand, will be set once the Phase 1 total power draw (load budget) is worked out. Until then, M04 costs use a provisional count of 10 towers (100 kW), marked as provisional."
  why: "VSAT is the solar tower closest to flight: NASA funded three full prototypes in 2022 and two were thermal-vacuum tested at NASA Johnson in 2024, aiming at TRL 6. VSAT-XL is a small-business study with a deployment prototype due by June 2027, and no flight is planned."
  timeline:
    - date: "Aug 2022"
      what: "NASA awards $19.4M to Astrobotic, Honeybee Robotics and Lockheed Martin to build 10 kW-class vertical solar array prototypes that deploy to about 10 m."
      title: "NASA Release 22-090: Three companies to help NASA advance solar array technology for the Moon"
      url: "https://www.nasa.gov/news-release/three-companies-to-help-nasa-advance-solar-array-technology-for-moon/"
    - date: "Sep 2023"
      what: "NASA's project review sets the goal of taking all three VSAT designs to TRL 6 in thermal-vacuum tests, and proposes a flight demonstration."
      title: "NASA GCD annual review: Vertical Solar Array Technology (VSAT) project"
      url: "https://ntrs.nasa.gov/citations/20230012849"
    - date: "Summer 2024"
      what: "Honeybee and Astrobotic VSAT prototypes are tested in Chamber A at NASA Johnson."
      title: "NASA: Johnson's thermal vacuum chamber tests lunar solar technology"
      url: "https://www.nasa.gov/centers-and-facilities/johnson/from-houston-to-the-moon-johnsons-thermal-vacuum-chamber-tests-lunar-solar-technology/"
    - date: "Jun 2025"
      what: "Astrobotic's 50 kW VSAT-XL gets an SBIR Phase II contract (to June 2027) to build a prototype of its deployment system. No flight is planned."
      title: "USAspending: NASA contract 80NSSC25C0032 (VSAT-XL SBIR Phase II)"
      url: "https://www.usaspending.gov/award/CONT_AWD_80NSSC25C0032_8000_-NONE-_-NONE-"
  quotes: []
  tradeoffs:
    - "Five 10 kW towers are needed for every 50 kW VSAT-XL they replace, which means more landings, more ridge sites and more cable."
    - "The solar capacity of M04, and its cost, stay provisional until the Phase 1 load budget is done."
    - "VSAT test results from 2024 are still not public, so its readiness rests on NASA's stated goals rather than published data."
- id: DD-005
  date: "2026-11-18"
  title: "Phase structure: Phase 1 is uncrewed base construction; the first crew landing starts Phase 2"
  status: Adopted
  affects: [phases, M02, M03, M04, M05, M06, M07, M08, M09, M10, M11, M12, M13, C08.1, C08.2, C08.3, C08.4, C09.1, C09.2, C09.3, roadmap, pbs]
  was: "Six phases: 0 Foundations (M00, M01); 1 Robotic outpost (M02–M06); 2 Crewed sorties (M07, M08), with crews visiting for 14–30 days; 3 Permanent base (M09), with burial, more modules and closed-loop life support added once crews were already visiting; 4 Industrial base (M10–M12); 5 Self-sustaining colony (M13)."
  now: "Five phases. Phase 0, Site selection and preparation (M00–M05): choose and prospect the site, book transport, then prepare it with communications, the power grid, landing pads, roads and berms. Phase 1, Base construction (M06–M08): uncrewed, autonomous building of everything the crew needs, including the ISRU plants, rovers, the habitat modules, their regolith cover, life support, storm shelter and medical bay. Phase 2, Crewed base (M09): starts when the first crew lands, and that crew stays. Phase 3, Industrial base (M10–M12). Phase 4, Self-sustaining colony (M13). There is no sortie phase. M08 is rescoped from 'First habitat and crewed sorties' to 'Base habitats, shielding and life support'; M09 from 'Permanent crew presence' to 'Crewed base: first landing and continuous rotation'. IDs, files and links stay the same."
  why: "The user's decision: the base is built before people arrive, and humans landing at the base is the start of Phase 2. Site preparation (M05) needs transport (M02) and power (M04), and the grid needs communications (M03), so all four sit with site selection in Phase 0. That keeps every milestone's dependencies inside its own phase or an earlier one, with no milestone split. Because the first crew stays, the regolith cover (C09.1) must be finished before the first landing: an unshielded 6.5-month tour would cost about 271 mSv, 45% of NASA's 600 mSv career limit (this plan's arithmetic from Chang'e-4's 1,369 µSv per day)."
  timeline:
    - date: "Sep 2020"
      what: "Chang'e-4 measures about 1,369 µSv per day on the lunar surface, so an unshielded crew would use up a career's dose limit in a little over a year."
      title: "Zhang et al., Science Advances: first measurements of the radiation dose on the lunar surface"
      url: "https://doi.org/10.1126/sciadv.aaz1334"
    - date: "Dec 2022"
      what: "NASA's technical brief sets the 600 mSv career effective dose limit for astronauts."
      title: "NASA OCHMO-TB-020: Design for ionizing radiation protection"
      url: "https://www.nasa.gov/wp-content/uploads/2023/03/radiation-protection-technical-brief-ochmo.pdf"
    - date: "2024"
      what: "An OLTARIS study finds at least 2 m of regolith is needed and gives about 150 mSv per 180 days at 2 m and about 100 mSv at 3 m, with no EVA."
      title: "Savage, IAC-24 abstract: Radiation shielding for long-term lunar settlements with regolith"
      url: "https://iafastro.directory/iac/paper/id/82864/abstract-pdf/IAC-24,D3,IP,1,x82864.brief.pdf"
    - date: "Oct 2026"
      what: "NASA lists lunar surface habitat delivery on cargo landers no earlier than FY2033, which sets the earliest start of habitat installation in Phase 1."
      title: "NASA HLS IAC 2026 presentation"
      url: "https://ntrs.nasa.gov/api/citations/20260009199/downloads/HLS%20IAC%202026%20Presentation%20FINAL.pdf"
  quotes: []
  tradeoffs:
    - "Phase 0 is now long (2026–2032) and holds most of the early spending, because the power grid and pads count as site preparation. The alternative, keeping power in Phase 1, would have left M05 (Phase 0) depending on M04 (Phase 1)."
    - "No crew visits the base before it is finished. Commissioning that sorties did before (the power, ISRU and mobility systems, and the dust lock) must be done remotely, and the first crew lands on systems never used by people."
    - "Burial must finish before the first landing. At 4 excavators × 200 kg/h the 2 m cover takes about 225 days and 3 m about 355 days; at the IPEx design rate it would take about 3–5 years (C09.1). The first crew date depends on excavator rate."
    - "The 'Phase 1 load budget' named in DD-004 now means the load of everything that must run when the first crew lands. The power hardware that serves it is built in Phase 0 (M04). Power sizing is unchanged until that budget is done."
    - "Costs move between milestones: the extra habitat modules, burial and life support upgrades move from M09 to M08, and the crew sorties are dropped."
- id: DD-006
  date: "2026-11-18"
  title: "Crew: base designed for 6, with flexible room for 9; crews of 3 rotate every 3 months with a 2-week handover"
  status: Adopted
  affects: [M02, M08, M09, M10, M13, C08.1, C08.2, C08.4, C09.1, C09.2, C09.3, C10.1, roadmap, regolith-radiation-shielding]
  was: "Crewed sorties of 2–4 people for 14–30 days (M08), then 4 people continuously in six-month rotations, growing to 8 (M09). M10 sized greenhouses for 8 crew."
  now: "The base is designed for 6 people, with flexible temporary room for up to 9. Crews of 3. A new crew lands every 3 months, and each handover overlap lasts 2 weeks: crew 1 lands; crew 2 lands 3 months later; crew 3 lands 3 months after that; crew 1 leaves 2 weeks after crew 3 arrives; and so on. Each tour lasts about 6.5 months. There are 3 people on base for the first 3 months, 6 in steady state, and 9 for about 2 weeks at each handover. That is 4 crew arrivals and 4 departures a year (this plan's arithmetic: 12 months ÷ 3 months). Average headcount in steady state is 6 + 3 × 0.5 ÷ 3 = 6.5 people (this plan's arithmetic)."
  why: "This is the user's decision. It follows the ISS pattern of staggered rotations, where half the crew changes at a time so experienced people are always aboard to hand over. When the ISS first went to six people in 2009, three new crew joined three already aboard, and a rotation of three of the six was due a few months later. NASA crews today hold a short handover with the crew they replace, and the station can hold more than its usual seven during a handover."
  timeline:
    - date: "May 2009"
      what: "ESA: the ISS crew increases to six for the first time. Three new crew join three already in residence and will spend six months aboard; a rotation of three of the six is due in October."
      title: "ESA: International Space Station doubles crew to six"
      url: "https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/OasISS_Mission/International_Space_Station_doubles_crew_to_six2"
    - date: "Jul 2025"
      what: "NASA: Crew-10 will leave the station after Crew-11 arrives and a handover period."
      title: "NASA: NASA's SpaceX Crew-10 to discuss station mission, upcoming return"
      url: "https://www.nasa.gov/news-release/nasas-spacex-crew-10-to-discuss-station-mission-upcoming-return/"
    - date: "Jul 2025"
      what: "NASA: Crew-11 conducts a short handover period on research and maintenance with the departing Crew-10."
      title: "NASA: What you need to know about NASA's SpaceX Crew-11 mission"
      url: "https://www.nasa.gov/missions/station/commercial-crew/what-you-need-to-know-about-nasas-spacex-crew-11-mission/"
    - date: "2026"
      what: "NASA: the ISS supports an international crew of seven, and sometimes more are aboard during a crew handover. Habitable volume is 388 m³, not counting visiting vehicles."
      title: "NASA: International Space Station facts and figures"
      url: "https://www.nasa.gov/international-space-station/space-station-facts-and-figures/"
  quotes:
    - text: "With a rotation of three of the six crewmembers due in October"
      src: "ESA, International Space Station doubles crew to six (May 2009)"
      url: "https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/OasISS_Mission/International_Space_Station_doubles_crew_to_six2"
    - text: "Sometimes more are aboard the station during a crew handover."
      src: "NASA, International Space Station facts and figures"
      url: "https://www.nasa.gov/international-space-station/space-station-facts-and-figures/"
  tradeoffs:
    - "Twice the crew transport rate of the old plan: 4 crewed landings and 4 departures a year, against 2 before. NASA plans a crewed landing every six months after Artemis V (M02), so this cadence is double NASA's plan. Over M09's 4 years this is 16 crewed missions, and crew transport becomes the largest cost in the plan."
    - "A 2-week handover is longer than the few days the ISS uses (plan design). It gives a 1/6 g base time to pass on hands-on knowledge, but means life support, the storm shelter and the beds must cope with 9 people for 2 weeks every 3 months."
    - "Each crew's lander is its way home, so up to three crew vehicles may need to wait on the surface at once, each for about 6.5 months. No crewed lander has published a surface stay of that length (open question)."
    - "Dose per tour: about 165 mSv at 2 m of regolith and about 110 mSv at 3 m before EVA (this plan's arithmetic, 198 days from the 150 and 100 mSv per 180 days in C09.1). One person could fly about 3.6 tours at 2 m, or 5.5 at 3 m, within 600 mSv, before EVA dose."
    - "The old plan's growth to 8 crew is dropped. The design stays at 6; growth beyond that is left to the colony phase (M13)."
- id: DD-007
  date: "2026-11-18"
  title: "Habitat: one standard 3-person module; the base lands three side by side and connects them"
  status: "Adopted; detailed module design to be defined later (open)"
  affects: [M08, M09, M10, C08.1, C08.2, C09.1, C09.2, C09.3, C10.1, roadmap, pbs, thales-alenia-space-multi-purpose-habitation-mph, sierra-space-life-inflatable]
  was: "One ~15 t Thales Alenia MPH-class wheeled module for 4 crew in M08 (with fold-down sleep stations), then 2 more of the same class in M09 for 4 to 8 crew."
  now: "The Phase 1 and Phase 2 habitat is one standard habitat module design that houses 3 people. The initial base lands 3 of these modules next to each other and connects them: 3 × 3 = 9 beds, 6 for residents and 3 flexible beds for handovers, which fits the DD-006 rotation (this plan's arithmetic). The detailed design of the module is to be defined later (open). The Thales Alenia MPH stays as heritage and reference hardware only, and its ~15 t mass is kept only as a provisional placeholder per module. Connection hardware between modules (hatches and tunnels) is a needed element, not yet designed."
  why: "The user's decision. One design built three times is simpler to build, test and spare than three different modules, and its 9 beds match the 9-person handover peak exactly."
  timeline:
    - date: "Jul 2025"
      what: "ASI signs a preliminary design contract with Thales Alenia Space for the MPH: about 3 m × 6 m, about 15 t, with a minimum 10-year life. Open Moon keeps it only as reference hardware."
      title: "Thales Alenia Space: contract with ASI to develop lunar Multi-Purpose Habitation module"
      url: "https://www.thalesgroup.com/en/worldwide/space/press_release/thales-alenia-space-signs-contract-italian-space-agency-asi-develop"
    - date: "Oct 2026"
      what: "NASA lists lunar surface habitat delivery on cargo landers no earlier than FY2033."
      title: "NASA HLS IAC 2026 presentation"
      url: "https://ntrs.nasa.gov/api/citations/20260009199/downloads/HLS%20IAC%202026%20Presentation%20FINAL.pdf"
  quotes: []
  tradeoffs:
    - "No module of this kind exists or is under contract. Until it is designed, mass, volume, power and cost per module are placeholders taken from the MPH class (~15 t) and the earlier plan."
    - "Three modules side by side change the footprint of the regolith arch in C09.1, which was sized for three modules in a line. Its regolith and arch figures stay as provisional placeholders."
    - "The connecting hatches or tunnels are new interfaces and new leak paths. They must be designed with the module."
    - "With 9 people for 2 weeks, every bed is in use and there is no spare bed if a module must be closed."
- id: DD-008
  date: "2026-11-18"
  title: "Power terms: EPS, PMAD and a power management controller (PMC); BMS now means only battery cell management"
  status: Adopted
  affects: [M00, M04, C04.1, C04.2, C04.3, C04.4, M10, M11, kilopower-krusty-fission-test, us-lunar-reactor-1-sparc, vertical-solar-array-technology-vsat, regenerative-fuel-cells, lunar-ac-power-transmission, roadmap, pbs]
  was: "DD-003 called the central hub that every source feeds, and that routes power to the grid or to storage, the 'BMS'. In this plan BMS meant the whole base power management and routing system, including battery cell management."
  now: "The plan uses standard industry and NASA terms. The EPS (electrical power system) is the whole system: generation, storage, distribution and protection. PMAD (power management and distribution) is its routing and distribution part. Every generation system (VSATs, the LR-1-class reactor, KRUSTY-class units) feeds the EPS through the power management controller (PMC). The PMC directs energy to the grid to meet demand, to the batteries to charge, or to excess-power handling. It keeps the two independent halves with a cross-tie, now called PMC main switching units A and B. Its decision-making function is what ground grids call a microgrid controller or energy management system (EMS), as in IEEE 2030.7. Each battery string connects through a battery charge/discharge unit (BCDU) and has its own BMS, which now means only the cell management system (cell voltage, temperature, balancing and charge limits); it reports to the PMC. Each VSAT's power electronics (array regulator and shunt) reduce or cut output on PMC command, and a disconnect contactor can isolate the tower. Reactor excess power goes to its parasitic load radiator (PLR). All DD-003 routing rules are unchanged: only the names change."
  why: "The user's decision. 'BMS' normally means a battery's own cell management, so using it for the whole base hub was confusing. The new names follow ISS and Space Station Freedom practice, where the EPS has a PMAD system, a sequential shunt unit (SSU) holds the ~160 V primary bus by shunting array strings, and battery charge/discharge units (BCDUs) and DC switching units (DCSUs) connect the batteries and route power."
  timeline:
    - date: "Aug 1991"
      what: "NASA Lewis describes the Space Station Freedom EPS source subsystem: a sequential shunt unit (SSU) that regulates the 160 V DC primary bus by shunting and unshunting 82 solar array strings, a battery charge/discharge unit (BCDU) and a DC switching unit (DCSU), tested on a PMAD DC test bed."
      title: "Button, NASA TM-104510: Development and testing of a source subsystem for the supporting development PMAD DC test bed"
      url: "https://ntrs.nasa.gov/api/citations/19910016888/downloads/19910016888.pdf"
    - date: "2017"
      what: "IEEE publishes 2030.7, the standard for the specification of microgrid controllers. This is the ground-grid name for the job the PMC does."
      title: "IEEE 2030.7: Standard for the Specification of Microgrid Controllers"
      url: "https://standards.ieee.org/ieee/2030.7/5941/"
    - date: "Apr 2022"
      what: "NASA Glenn describes lunar microgrids with a controller that sends power to the highest-priority loads first."
      title: "Csank & Scott, Power and Energy for the Lunar Surface"
      url: "https://ntrs.nasa.gov/api/citations/20220005893/downloads/Power%20and%20Energy%20for%20the%20Lunar%20Surface.pdf"
    - date: "Sep 2026"
      what: "NASA's LR-1 requirements include start-up with electric power shunted by a parasitic load radiator, and a user load from 0 to 100% of output."
      title: "NASA Glenn, SPARC Industry Day presentation (LR-1 requirements)"
      url: "https://sam.gov/api/prod/opps/v3/opportunities/resources/files/6b927f8dc6c843749a45b2c0589bf0e7/download"
    - date: "2026"
      what: "The ISS today: 82 array strings feed a sequential shunt unit that holds the primary bus near 160 V DC; BCDUs regulate battery charge and discharge; power reaches users through DCSUs and DC-to-DC converters."
      title: "Wikipedia: Electrical system of the International Space Station"
      url: "https://en.wikipedia.org/wiki/Electrical_system_of_the_International_Space_Station"
  quotes:
    - text: "The SSU regulates the primary bus voltage by actively shunting and unshunting solar array strings"
      src: "NASA TM-104510 (1991)"
      url: "https://ntrs.nasa.gov/api/citations/19910016888/downloads/19910016888.pdf"
  tradeoffs:
    - "Names only. No routing rule, size, cost or voltage changes. Old text in DD-002 and DD-003 still says BMS for the hub; read it as PMC."
    - "More acronyms (EPS, PMAD, PMC, BCDU, BMS, PLR). Each page spells them out the first time."
    - "The PMC is still the single most critical piece of power equipment, as DD-003 said for the BMS. Main switching units A and B with a cross-tie, and several battery strings, remain the answer."
- id: DD-009
  date: "2026-11-18"
  title: "Distribution: the base grid works like a national grid, and every unit has its own service connection and 120 V DC panel"
  status: Adopted
  affects: [M04, C04.3, C04.4, M06, C06.1, C06.2, C06.3, M08, C08.1, C08.2, M09, M10, C10.1, M11, C11.1, C03.1, C05.1, lunar-ac-power-transmission, roadmap, pbs]
  was: "Following NASA's 2022 grid study, the PMC (then called the BMS) sent 3 kV AC feeders to two separate 120 V DC microgrids, one for the habitat and one for ISRU. Habitat modules plugged into the habitat microgrid."
  now: "The base grid is the 'national grid': the 3 kV AC, 3-phase, 1 kHz distribution network fed by the PMC (DD-001 voltage and frequency unchanged). There are no separate habitat and ISRU microgrids. Each unit has its own independent service connection to the grid, like a house: a service drop from the grid, a step-down and rectifier converter (UMIC-class) that delivers 120 V DC (NASA's space power standard), a meter, and a main breaker or disconnect, feeding the unit's DC panel and subpanels. Every system in the unit is then fed from that panel by branch circuits. The grid does not supply AC to units. A unit that needs AC has its own inverter, fed from its DC panel, feeding a local AC subpanel for that unit only; each unit chooses its own inverter and AC voltage. Each of the 3 habitat modules (DD-007) has its own service connection. Non-habitat systems connect the same way, each with its own service connection and panel: the regolith water-extraction plant, water electrolysis (H₂/O₂), the oxygen plant, life-support processing outside the habitats, comms nodes, rover chargers, greenhouses and the propellant depot. Any service connection can be isolated without affecting the others."
  why: "The user's decision. One standard connection, repeated for every unit, is simpler to design, test and spare than custom microgrids. It keeps 3 kV AC for transmission, where NASA chose AC because high-voltage DC lacks radiation-hard switches, and gives every unit the 120 V DC that NASA's space hardware already uses. Space Station Freedom used the same pattern: a primary bus, converted to 120 V DC by DC-to-DC converter units for secondary distribution to users. Isolating one unit's connection leaves the rest of the base powered."
  timeline:
    - date: "Aug 1991"
      what: "Space Station Freedom's EPS: primary power at 160 V DC is converted to 120 V DC by DC-to-DC converter units (DDCUs), and a secondary distribution system takes 120 V DC to the users."
      title: "Button, NASA TM-104510 (PMAD DC test bed)"
      url: "https://ntrs.nasa.gov/api/citations/19910016888/downloads/19910016888.pdf"
    - date: "Aug 2022"
      what: "NASA Glenn's lunar grid trade study selects a 3 kV AC trunk joining separate habitat and ISRU microgrids. Open Moon replaces the two microgrids with one grid and a service connection per unit."
      title: "Thomas, Granger, Csank & Gardner, Establishing a Lunar Surface Power Grid"
      url: "https://ntrs.nasa.gov/citations/20220011587"
    - date: "Sep 2023"
      what: "NASA publishes the UMIC, which connects 120 V DC space equipment to a 3 kV AC grid at 1 kHz, with DC switch modules to isolate faults and a relay to disconnect the transformer. It is the plan's service-connection converter."
      title: "Thomas et al., A Modular AC to DC Interface Converter (UMIC)"
      url: "https://ntrs.nasa.gov/citations/20230013309"
    - date: "2025"
      what: "NASA/DOE's reactor reference design delivers 3 kVac at 1 kHz to a user interface 1 km away, selected to leverage the UMIC."
      title: "Mason et al., Key Design Trades for a Near-term Lunar Fission Surface Power System (NETS 2025)"
      url: "https://ntrs.nasa.gov/citations/20250000841"
  quotes:
    - text: "The primary distribution power is converted to 120Vdc by DC to DC Converters (DDCUs). The secondary distribution system then distributes the 120Vdc power to the SSF users."
      src: "NASA TM-104510 (1991)"
      url: "https://ntrs.nasa.gov/api/citations/19910016888/downloads/19910016888.pdf"
  tradeoffs:
    - "More converters: one UMIC-class service converter per unit instead of one per microgrid. Each is smaller, and all are the same design, but the count of boxes to fly and spare goes up."
    - "More service drops from the grid. Each is short, but the grid needs a tap and protection for every unit."
    - "Units that need AC carry their own inverter. No base-wide AC user voltage is set; each unit picks its own."
    - "Mass and cost of the extra converters are not yet in M04, M06 or M08; they sit inside the existing converter and grid hardware items until the load budget sizes them (open)."

- id: DD-010
  date: "2026-11-18"
  title: "Site search narrows to the Shackleton–de Gerlache focus area"
  status: Adopted
  affects: [M00, M01, M02, roadmap]
  was: "The site search started from NASA's nine Artemis III candidate regions across the whole south pole, with no preferred area."
  now: "Open Moon's site search concentrates on a focus area of about 180 × 130 km around the south pole, centred on the Shackleton–de Gerlache Ridge between Shackleton, Spudis and de Gerlache craters. It includes NASA's de Gerlache Rim 2 region. The primary and backup sites will be chosen inside it from the slope, hydrogen and ice-candidate maps on the M00 page."
  why: "The user's decision. The ridge is the sunniest ground studied near the pole, a 30 km topographic high joining two craters whose shadowed floors are the area's ice candidates, and NASA's first Blue Moon Mark 1 cargo mission also targets the Shackleton connecting ridge."
  timeline:
    - date: "Aug 2022"
      what: "NASA's first list of 13 Artemis III regions includes Connecting Ridge and Connecting Ridge Extension."
      title: "NASA: NASA Identifies Candidate Regions for Landing Next Americans on Moon"
      url: "https://www.nasa.gov/news-release/nasa-identifies-candidate-regions-for-landing-next-americans-on-moon/"
    - date: "Oct 2024"
      what: "NASA narrows to nine regions; de Gerlache Rim 2 is the one inside the focus area."
      title: "NASA: NASA Provides Update on Artemis III Moon Landing Regions"
      url: "https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/"
    - date: "Mar 2024"
      what: "LROC publishes 2 m/px maps of the Shackleton–de Gerlache Ridge: 30 km long, summit 1959.5 m, benign slopes from Cheetham crater to the summit."
      title: "LROC: Shackleton–de Gerlache Ridge maps"
      url: "https://lroc.im-ldi.com/data/support/popular_downloads/LROC_Shackleton_deGerlache_Ridge_maps.zip"
    - date: "2023"
      what: "NASA Goddard publishes 10 m/px LOLA slope and shadowed-region maps of the south pole, used for the focus-area maps."
      title: "NASA GSFC PGDA: A New View of the Lunar South Pole from LOLA (Barker et al. 2023)"
      url: "https://pgda.gsfc.nasa.gov/products/90"
  tradeoffs:
    - "Concentrating on one area means other NASA regions (Malapert Massif, Mons Mouton, Haworth and others) are not mapped in the same detail."
    - "The strongest LEND hydrogen in the focus area (around 88°S, 0–60°E) is away from the ridge, and ice in Shackleton and de Gerlache is unconfirmed."
    - "Other programmes target the same ground (NASA's Blue Moon Mark 1 Pathfinder, China's Chang'e-7 near Shackleton), so coordination under the Artemis Accords matters more."

- id: DD-011
  date: "2026-11-18"
  title: "Landing points must be on ground of 8° slope or less"
  status: Adopted
  affects: [M00, M01, M02, M05, C05.2]
  was: "Open Moon's slope maps marked 15° or less as suitable for landing."
  now: "Every landing point, for any lander, must be on ground of 8° or less in NASA's LOLA slope data, and within the lander's own published limit. Ground steeper than 8° is not a landing site, though rovers, masts and towers may still work on it within their own limits (for example 15° for VSAT and IPEx)."
  why: "The user's decision, based on the lander research. No lander publishes a certified slope above 10°; Nova-C's design limit is 10° and IM-1 tipped over after landing on 12° ground. NASA caps crewed landers at 8° tilt after landing and requires landing sites under 10°."
  timeline:
    - date: "Feb 2024"
      what: "IM-1 lands near Malapert A on 12° terrain, faster than planned, breaks a leg and tips over."
      title: "NASA: LRO images Intuitive Machines' Odysseus lander"
      url: "https://www.nasa.gov/missions/lro/nasas-lro-images-intuitive-machines-odysseus-lander/"
    - date: "Mar 2024"
      what: "Intuitive Machines states Nova-C 'can land on slopes up to 10°'."
      title: "Bussey & Martin, LPSC 2024 abstract 1931"
      url: "https://www.hou.usra.edu/meetings/lpsc2024/pdf/1931.pdf"
    - date: "2024"
      what: "NASA's HLS requirements give a landing-site slope under 10° over 100 m."
      title: "NASA NTRS: Artemis HLS Update 2024"
      url: "https://ntrs.nasa.gov/api/citations/20240009596/downloads/ArtemisHLSUpdate_2024.pdf"
    - date: "Mar 2026"
      what: "NASA OIG reports NASA's limit of no more than 8° post-landing tilt for crew activities on both HLS landers."
      title: "NASA OIG IG-26-004"
      url: "https://oig.nasa.gov/wp-content/uploads/2026/03/final-report-ig-26-004-nasas-management-of-the-human-landing-system-contracts.pdf"
  tradeoffs:
    - "Less landable ground: in the focus area 43% is 8° or less, against 78% at 15° or less."
    - "Some ground that robotic landers could probably handle (8–10°) is excluded."
    - "At 10–40 m per pixel, boulders and small craters are not resolved; each pad still needs ~1 m LROC NAC hazard maps."

- id: DD-012
  date: "2026-11-18"
  title: "Slope maps use four classes: ≤8°, 8–15°, 15–20°, ≥20°"
  status: Adopted
  affects: [M00, landers]
  was: "Slope maps used a continuous green-to-red colour ramp, then a single ≤15° / >15° split."
  now: "Slope maps use four classes: green ≤8° (landable, DD-011), yellow 8–15°, orange 15–20°, red ≥20°. The raw LDSM values are also shown on a continuous scale, and the combined landing map shows only the ≤8° ground in green."
  why: "The user's decision. The breaks follow the lander research: 8° is NASA's crewed-lander tilt limit, published robotic lander limits stop at 10°, nothing is rated above 15°, and the NASA OIG notes south-pole slopes reach about 20°."
  timeline:
    - date: "2023"
      what: "NASA Goddard's LOLA slope map (LDSM) at 10 m/px is the data behind every class."
      title: "NASA GSFC PGDA: A New View of the Lunar South Pole from LOLA"
      url: "https://pgda.gsfc.nasa.gov/products/90"
    - date: "Oct 2026"
      what: "Griffin's parent company says its wide stance 'can easily tolerate a 10-degree slope'."
      title: "Voyager Technologies: How Voyager chose Griffin's lunar landing site"
      url: "https://voyagertechnologies.com/insights/how-voyager-chose-griffins-lunar-landing-site/"
    - date: "Mar 2026"
      what: "NASA OIG: post-landing tilt limit of 8°; south-pole slopes reach about 20°."
      title: "NASA OIG IG-26-004"
      url: "https://oig.nasa.gov/wp-content/uploads/2026/03/final-report-ig-26-004-nasas-management-of-the-human-landing-system-contracts.pdf"
  tradeoffs:
    - "Classes hide detail inside each band; the raw slope map is kept alongside for that."
    - "Class breaks are this plan's choice from published limits, not a NASA standard."
