- n: 0
  years: "Years 0–5"
  name: Site selection and preparation
  desc: "Choose the site with data already in hand from lunar orbiters, ground-truth it with robotic prospectors, and lock the transport contracts. Then robots prepare the site: communications, the power grid, hardened landing pads, roads and berms. Nothing that the base itself depends on lands until the site is confirmed (design change DD-005)."
- n: 1
  years: "Years 5–8"
  name: Base construction
  desc: "Uncrewed, autonomous building of the whole base before anyone lands. Robots and cargo landers put down the oxygen and water plants, the rovers, and three standard 3-person habitat modules side by side, connected to each other. Robots bury the modules under regolith, and life support, the storm shelter and the medical bay run uncrewed until they pass checkout (DD-005, DD-007)."
- n: 2
  years: "Years 8–13"
  name: Crewed base
  desc: "Starts the day the first crew lands. There are no short visits; the first crew stays. Crews of three arrive every three months and each stays about six and a half months, so the base holds 3 people at first, then 6, with 9 for about two weeks at each handover (DD-006). Life support recycles most water and air, and resupply drops to a steady cadence."
- n: 3
  years: "Years 13–17"
  name: Industrial base
  desc: "The base starts making what it consumes, including oxygen and propellant, building materials, spare parts and food, so each crew member needs less from Earth every year."
- n: 4
  years: "Years 17–23"
  name: Self-sustaining colony
  desc: "The base grows into a colony that produces most of its own mass needs, measured as the share of consumables and construction mass made on the Moon, with Earth supplying only high-tech parts and people."
