<rect x="16" y="300" width="204" height="56" rx="6" fill="rgba(255,176,32,.12)" stroke="#ffb020" stroke-width="2"/>
<text x="26" y="318" fill="#ffb020" font-size="12">10 kW VSAT #2</text>
<text x="26" y="334">second ridge point</text>
<text x="26" y="348" opacity=".75">curtails on BMS command</text>
<rect x="16" y="384" width="204" height="72" rx="6" fill="rgba(255,176,32,.12)" stroke="#ffb020" stroke-width="2"/>
<text x="26" y="402" fill="#ffb020" font-size="12">LR-1-CLASS REACTOR</text>
<text x="26" y="418">20 kWe, closed Brayton</text>
<text x="26" y="432">alternator → step-up xfmr</text>
<text x="26" y="446" opacity=".75">3 kV RMS AC output</text>
<rect x="16" y="482" width="204" height="48" rx="6" fill="none" stroke="#ffb020" stroke-dasharray="4 3"/>
<text x="26" y="500" fill="#ffb020" font-size="11">PARASITIC LOAD RADIATOR</text>
<text x="26" y="518" opacity=".75">start-up; surplus when full</text>
