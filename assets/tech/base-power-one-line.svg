<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" font-family="Share Tech Mono, monospace" role="img" aria-labelledby="t d">
<title id="t">Open Moon base power one-line diagram</title>
<desc id="d">One-line electrical diagram. Each 10 kW VSAT solar tower and the LR-1-class reactor sends 3 kV AC over its own source line to an input converter on the power management controller (PMC). The PMC has two main switching units, A and B, each a DC bus, joined by a cross-tie. Li-ion battery strings connect to each unit through battery charge/discharge units (BCDUs), each string with its own BMS. Regenerative fuel cells are charged by PMC surplus through their electrolyser and, when they discharge, only recharge the battery; they have no direct path to the grid. Output converters feed the 3 kV AC distribution grid. The grid feeds each of three habitat modules, each ISRU plant, comms nodes, rover chargers and later greenhouses and the depot through its own service connection: a service drop and main breaker, a UMIC-class converter to 120 V DC, a meter and a DC panel. Solar towers are curtailed by their shunt regulators and the reactor sends surplus to its parasitic load radiator.</desc>
