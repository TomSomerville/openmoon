<text x="16" y="574" fill="#d6e2ec" font-size="12">ROUTING (plan design)</text>
<text x="16" y="594">1 meet demand, life support first</text>
<text x="16" y="610">2 surplus → battery</text>
<text x="16" y="626">3 battery full → electrolyser</text>
<text x="16" y="642">4 all full → curtail solar,</text>
<text x="30" y="656">reactor surplus → PLR</text>
<text x="16" y="672">5 short → battery feeds grid,</text>
<text x="30" y="686">fuel cells recharge battery,</text>
<text x="30" y="700">shed loads as last resort</text>
</g>

