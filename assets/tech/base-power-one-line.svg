<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" font-family="Share Tech Mono, monospace" role="img" aria-labelledby="t d">
<title id="t">Open Moon base power one-line diagram</title>
<desc id="d">One-line electrical diagram. Each 10 kW VSAT solar tower and the LR-1-class reactor sends 3 kV AC over its own source line to an input converter on the BMS hub. The BMS has two DC bus halves, A and B, joined by a cross-tie. Li-ion battery strings hang off each half. Regenerative fuel cells are charged by BMS surplus through their electrolyser and, when they discharge, only recharge the battery; they have no direct path to the grid. Output converters send 3 kV AC feeders to transformers and UMIC converters at the 120 V DC habitat and ISRU microgrids. Solar towers can be curtailed and the reactor sends surplus to its parasitic load radiator.</desc>
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(56,212,240,.07)"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb020"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38d4f0"/></marker>
</defs>
<rect width="960" height="740" fill="#0a1015"/><rect width="960" height="740" fill="url(#g)"/>
<text x="24" y="36" fill="#d6e2ec" font-size="19" letter-spacing="1">ONE-LINE DIAGRAM · BASE POWER SYSTEM</text>
<text x="24" y="56" fill="#d6e2ec" font-size="12" opacity=".7">Plan design (DD-001, DD-003). One line per 3-phase circuit; protection and switching simplified.</text>

