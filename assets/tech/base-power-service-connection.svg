<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" width="960" height="750" font-family="Share Tech Mono, monospace" role="img" aria-labelledby="t d">
<title id="t">Open Moon service connections: every unit is a house on the grid</title>
<desc id="d">The 3 kV AC, 1 kHz base grid, fed by the power management controller (PMC), works like a national grid. Three habitat modules and a water electrolysis plant each take power through their own service connection: a service drop from the grid, a UMIC-class converter that steps down and rectifies 3 kV AC to 120 V DC, a meter that reports to the PMC, and a main breaker. The main breaker feeds the unit's 120 V DC panel, which feeds branch circuits, each with its own breaker: in a habitat module, life support, lighting, galley, avionics and heaters. A habitat module that needs AC has its own optional inverter, fed from its DC panel, feeding a local AC subpanel whose voltage the module chooses. The water electrolysis plant needs no AC and has no inverter. Opening any one main breaker leaves the other units powered. Plan design, design change DD-009.</desc>
