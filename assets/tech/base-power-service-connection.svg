<text x="24" y="700" fill="#d6e2ec" font-size="11" opacity=".8">Heritage: NASA's UMIC links 120 V DC equipment to a 3 kV AC grid (2023); Space Station Freedom distributed 120 V DC to users (1991).</text>
<text x="24" y="716" fill="#d6e2ec" font-size="11" opacity=".8">Branch circuits are examples. Ratings wait for the Phase 1 load budget.</text>
