<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Share Tech Mono, monospace" role="img" aria-labelledby="t d">
<title id="t">Open Moon base power site layout (plan view, not to scale)</title>
<desc id="d">Plan view of the base power system. Several 10 kW VSAT solar towers stand on two or three ridge points. An LR-1-class reactor sits 1 to 3 km from the habitat zone behind terrain, with its 36 degree shield shadow pointed at the crew. Each tower and the reactor makes its own 3 kV AC at the source (inverter and 1 kHz step-up transformer at each tower; 3 kV, 1 kHz at the reactor output), and every source sits within 3 km of cable run of the PMC. Source lines run from each tower and from the reactor to the power management controller (PMC) near the habitat zone. The ISRU plants are also within 3 km. The 3 kV AC distribution grid runs from the PMC to the three habitat modules and the ISRU plants, and each of them has its own service connection with a main breaker. Landing pads are kept at least 1 km from the towers. Distances are plan values; the drawing is schematic and not to scale.</desc>
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(56,212,240,.07)"/></pattern>
<pattern id="hill" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="rgba(214,226,236,.18)" stroke-width="2"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb020"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38d4f0"/></marker>
<marker id="dw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d6e2ec"/></marker>
<g id="tower"><path d="M0 0V-34" stroke="#ffb020" stroke-width="2"/><rect x="-9" y="-46" width="18" height="12" fill="rgba(255,176,32,.25)" stroke="#ffb020"/><path d="M-6 2H6" stroke="#ffb020" stroke-width="2"/></g>
</defs>
<rect width="960" height="640" fill="#0a1015"/><rect width="960" height="640" fill="url(#g)"/>
<text x="24" y="36" fill="#d6e2ec" font-size="19" letter-spacing="1">BASE POWER SITE LAYOUT · PLAN VIEW</text>
<text x="24" y="58" fill="#d6e2ec" font-size="12" opacity=".7">Schematic, NOT TO SCALE. Every source converts to 3 kV AC on the spot and runs ≤3 km of cable to the PMC (DD-010).</text>

<!-- ridge -->
<path d="M30 175C120 150 200 140 280 132S460 120 560 140 650 150 680 160" fill="none" stroke="#d6e2ec" stroke-width="2" opacity=".35"/>
<path d="M30 175C120 150 200 140 280 132S460 120 560 140 650 150 680 160L680 186C600 176 520 166 420 160S200 170 30 200Z" fill="url(#hill)" opacity=".8"/>
<text x="40" y="218" fill="#d6e2ec" font-size="11" opacity=".7">SUNLIT RIDGE (crater rim)</text>

<!-- towers on ridge points -->
<g>
<use href="#tower" x="130" y="150"/><use href="#tower" x="156" y="146"/>
<circle cx="143" cy="152" r="26" fill="none" stroke="#ffb020" stroke-dasharray="3 3" opacity=".7"/>
<text x="143" y="92" fill="#ffb020" font-size="12" text-anchor="middle">RIDGE POINT 1</text>
<use href="#tower" x="318" y="128"/><use href="#tower" x="344" y="126"/>
<circle cx="331" cy="130" r="26" fill="none" stroke="#ffb020" stroke-dasharray="3 3" opacity=".7"/>
<text x="362" y="100" fill="#ffb020" font-size="12">RIDGE POINT 2</text>
<use href="#tower" x="530" y="140"/>
<circle cx="530" cy="142" r="22" fill="none" stroke="#ffb020" stroke-dasharray="3 3" opacity=".5"/>
<text x="548" y="112" fill="#ffb020" font-size="12" opacity=".85">RIDGE POINT 3</text>
<text x="548" y="126" fill="#d6e2ec" font-size="10" opacity=".7">(if used)</text>
</g>
<text x="548" y="210" fill="#d6e2ec" font-size="11">10 kW VSAT ×N</text>
<text x="548" y="226" fill="#d6e2ec" font-size="10" opacity=".7">on 2–3 ridge points</text>
<text x="548" y="240" fill="#d6e2ec" font-size="10" opacity=".7">shadowed at different</text>
<text x="548" y="254" fill="#d6e2ec" font-size="10" opacity=".7">times; count TBD</text>
<text x="548" y="268" fill="#ffb020" font-size="10">each ≤3 km cable to PMC</text>

<!-- reactor, terrain, shield cone -->
<path d="M800 380L480 276L480 484Z" fill="rgba(56,212,240,.06)" stroke="#38d4f0" stroke-dasharray="5 5" opacity=".8"/>
<text x="560" y="300" fill="#38d4f0" font-size="10" opacity=".9" transform="rotate(18 560 300)">36° shield shadow</text>
<path d="M690 300C705 330 712 360 710 400S700 450 688 470L668 470C680 440 688 410 688 380S680 330 668 300Z" fill="url(#hill)" stroke="#d6e2ec" stroke-opacity=".35"/>
<text x="650" y="290" fill="#d6e2ec" font-size="10" opacity=".75" text-anchor="middle">TERRAIN / BERM</text>
