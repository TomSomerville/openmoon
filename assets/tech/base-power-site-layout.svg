<g fill="none" stroke="#d6e2ec" opacity=".6"><circle cx="110" cy="575" r="20"/><circle cx="180" cy="575" r="20"/><path d="M100 575H120M110 565V585M170 575H190M180 565V585"/></g>
<text x="215" y="570" fill="#d6e2ec" font-size="11">LANDING PADS (M05)</text>
<text x="215" y="585" fill="#d6e2ec" font-size="10" opacity=".75">kept ≥1 km from towers, arrays</text>
<text x="215" y="598" fill="#d6e2ec" font-size="10" opacity=".75">and radiators (plan)</text>

<!-- legend -->
<rect x="716" y="76" width="226" height="226" rx="8" fill="rgba(10,16,21,.85)" stroke="#d6e2ec" stroke-opacity=".25"/>
<text x="730" y="98" fill="#d6e2ec" font-size="12">KEY</text>
<path d="M730 118H770" stroke="#ffb020" stroke-width="2.5"/><text x="780" y="122" fill="#d6e2ec" font-size="10">source line → PMC</text>
<path d="M730 140H770" stroke="#38d4f0" stroke-width="2.5"/><text x="780" y="144" fill="#d6e2ec" font-size="10">3 kV AC grid PMC → units</text>
<use href="#tower" transform="translate(750 192) scale(.6)"/><text x="780" y="180" fill="#d6e2ec" font-size="10">10 kW VSAT tower</text>
<rect x="736" y="202" width="28" height="18" rx="3" fill="rgba(56,212,240,.18)" stroke="#38d4f0"/><text x="780" y="215" fill="#d6e2ec" font-size="10">PMC units A / B</text>
<rect x="745" y="232" width="10" height="10" fill="#0a1015" stroke="#ffb020" stroke-width="2"/><text x="780" y="241" fill="#d6e2ec" font-size="10">service connection</text>
<rect x="745" y="253" width="10" height="10" fill="#ffb020" transform="rotate(45 750 258)"/><text x="780" y="262" fill="#d6e2ec" font-size="10">inverter + 1 kHz xfmr</text>
<text x="730" y="288" fill="#d6e2ec" font-size="10" opacity=".75">Cable lies on the surface</text>

<text x="24" y="628" fill="#d6e2ec" font-size="10" opacity=".6" letter-spacing="1">DIAGRAM · OPEN MOON PLAN DESIGN (DD-002, DD-003, DD-008, DD-009, DD-010) · NOT TO SCALE · CC BY-SA 4.0</text>
</svg>
