<path d="M786 356V404" stroke="#38d4f0" stroke-width="4" opacity=".7"/>
<path d="M836 364H870M836 380H876M836 396H870" stroke="#ffb020" opacity=".7"/>
<text x="812" y="336" fill="#ffb020" font-size="12" text-anchor="middle">LR-1-CLASS REACTOR</text>
<text x="812" y="350" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".8">3 kV · 1 kHz out · PLR</text>
<text x="830" y="424" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".8">shield faces crew zone</text>
<text x="830" y="438" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".8">≤5 rem/yr at 1 km</text>

<!-- distance: reactor to habitat -->
<path d="M786 512H430" stroke="#d6e2ec" stroke-width="1" marker-start="url(#dw)" marker-end="url(#dw)" opacity=".8"/>
<path d="M786 500V522M430 500V522" stroke="#d6e2ec" opacity=".6"/>
<text x="608" y="530" fill="#d6e2ec" font-size="11" text-anchor="middle">reactor 1–3 km from habitat zone; ≤3 km cable to PMC</text>

<!-- PMC and habitat zone -->
<rect x="300" y="420" width="260" height="70" rx="10" fill="none" stroke="#d6e2ec" stroke-dasharray="4 4" opacity=".5"/>
<text x="430" y="482" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".7">HABITAT ZONE · one connection per module</text>
<rect x="390" y="318" width="96" height="56" rx="8" fill="rgba(56,212,240,.18)" stroke="#38d4f0" stroke-width="2.5"/>
<path d="M438 322V370" stroke="#38d4f0" opacity=".7"/>
<text x="414" y="342" fill="#38d4f0" font-size="12" text-anchor="middle">A</text><text x="462" y="342" fill="#38d4f0" font-size="12" text-anchor="middle">B</text>
<text x="438" y="364" fill="#d6e2ec" font-size="10" text-anchor="middle">PMC</text>
<text x="500" y="336" fill="#d6e2ec" font-size="10" opacity=".8">+ battery</text>
<text x="500" y="350" fill="#d6e2ec" font-size="10" opacity=".8">+ fuel cells</text>
<g font-size="10" fill="#d6e2ec" text-anchor="middle">
<rect x="328" y="440" width="48" height="26" rx="5" fill="rgba(56,212,240,.10)" stroke="#38d4f0"/><text x="352" y="457">HAB 1</text>
<rect x="388" y="440" width="48" height="26" rx="5" fill="rgba(56,212,240,.10)" stroke="#38d4f0"/><text x="412" y="457">HAB 2</text>
<rect x="448" y="440" width="48" height="26" rx="5" fill="rgba(56,212,240,.10)" stroke="#38d4f0"/><text x="472" y="457">HAB 3</text>
</g>

<!-- ISRU -->
<rect x="40" y="420" width="170" height="70" rx="8" fill="rgba(56,212,240,.10)" stroke="#38d4f0"/>
<text x="125" y="446" fill="#d6e2ec" font-size="11" text-anchor="middle">ISRU PLANTS</text>
<text x="125" y="462" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".75">one connection per plant</text>
<text x="125" y="476" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".75">(M06) · ≤3 km from PMC</text>

<!-- source-end converters: inverter + 1 kHz transformer (DD-010) -->
<g fill="#ffb020" stroke="#0a1015" stroke-width="1"><rect x="145" y="172" width="11" height="11" transform="rotate(45 150.5 177.5)"/><rect x="329" y="150" width="11" height="11" transform="rotate(45 334.5 155.5)"/><rect x="523" y="160" width="11" height="11" transform="rotate(45 528.5 165.5)"/></g>
<!-- source lines (amber) -->
<g stroke="#ffb020" stroke-width="2.5" fill="none" marker-end="url(#ah)">
<path d="M150 178C170 260 330 300 392 330"/>
<path d="M334 156C350 230 400 280 420 316"/>
<path d="M528 166C520 240 480 290 466 316"/>
<path d="M788 388C700 380 660 340 600 340S520 344 488 346"/>
</g>
<text x="600" y="368" fill="#ffb020" font-size="10" text-anchor="middle">source line, 3 kV AC, ≤3 km</text>

<!-- feeders (cyan) -->
<g stroke="#38d4f0" stroke-width="2.5" fill="none" marker-end="url(#ac)">
<path d="M390 350C300 350 230 380 212 430"/>
</g>
<g stroke="#38d4f0" stroke-width="2.5" fill="none"><path d="M420 374V414"/><path d="M352 414H472"/></g>
<g stroke="#38d4f0" stroke-width="2" fill="none" marker-end="url(#ac)"><path d="M352 414V438"/><path d="M412 414V438"/><path d="M472 414V438"/></g>
<g fill="#0a1015" stroke="#ffb020" stroke-width="2"><rect x="347" y="420" width="10" height="10"/><rect x="407" y="420" width="10" height="10"/><rect x="467" y="420" width="10" height="10"/><rect x="224" y="397" width="10" height="10"/></g>
<text x="298" y="394" fill="#38d4f0" font-size="10" text-anchor="middle">3 kV AC grid</text>
<text x="298" y="407" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".7">length TBD</text>

