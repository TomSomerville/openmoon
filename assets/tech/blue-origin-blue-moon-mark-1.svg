<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Blue Moon Mark 1 cargo lander concept">
<title>Blue Moon Mark 1 cargo lander concept</title>
<defs><pattern id="g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="rgba(56,212,240,.07)" stroke-width="1"/></pattern></defs>
<style>.l{fill:none;stroke:#38d4f0;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.f{fill:rgba(56,212,240,.08);stroke:#38d4f0;stroke-width:2;stroke-linejoin:round}.a{fill:none;stroke:#ffb020;stroke-width:2;stroke-linecap:round}.af{fill:#ffb020}.t{fill:#d6e2ec;font-family:"Share Tech Mono",monospace;font-size:14px}.s{font-size:12px}.c{fill:none;stroke:#d6e2ec;stroke-width:1;opacity:.6}.d{stroke-dasharray:6 5}</style>
<rect width="800" height="500" fill="#0a1015"/><rect width="800" height="500" fill="url(#g)"/>
<!-- Blue Moon Mark 1 cargo lander concept -->
<path class="f" d="M0 420 Q200 410 380 418 T800 414 V470 H0Z"/>
<path class="l" d="M540 414 L610 340 L660 365 L730 315 L800 340"/>
<!-- cargo deck -->
<rect class="f" x="230" y="52" width="140" height="34"/>
<rect class="f" x="255" y="26" width="40" height="26"/><rect class="f" x="310" y="34" width="44" height="18"/>
<rect class="l" x="212" y="86" width="176" height="14"/>
<!-- upper tank -->
<rect class="f" x="222" y="100" width="156" height="100" rx="40"/>
<!-- lower tank -->
<rect class="f" x="222" y="205" width="156" height="150" rx="50"/>
<path class="l" d="M222 202h156"/>
<!-- engine -->
<path class="l" d="M290 355 V368 H310 V355"/>
<path class="f" d="M285 368 L270 405 H330 L315 368Z" style="stroke:#ffb020"/>
<!-- legs -->
<path class="l" d="M228 300 L150 416 M372 300 L450 416 M250 340 L210 416 M350 340 L390 416"/>
<path class="l" d="M228 250 L170 385 M372 250 L430 385"/>
<path class="l" d="M134 416h32 M434 416h32 M196 416h28 M376 416h28"/>
<!-- height -->
<path class="c" d="M120 26 V416 M114 26h12 M114 416h12"/>
<text class="t s" x="60" y="220">≈8 m</text>
<!-- callouts -->
<line class="c" x1="370" y1="60" x2="470" y2="60"/><text class="t" x="476" y="64">CARGO DECK · UP TO 3 t</text>
<line class="c" x1="378" y1="150" x2="470" y2="140"/><text class="t" x="476" y="144">LIQUID HYDROGEN / OXYGEN</text><text class="t s" x="476" y="162">PROPELLANT TANKS</text>
<line class="c" x1="330" y1="390" x2="470" y2="380"/><text class="t" x="476" y="384">SINGLE BE-7 ENGINE</text>
<text class="t s" x="560" y="440">SOUTH-POLE RIDGE TERRAIN</text>
<text class="t s" x="20" y="485" fill-opacity=".8">CONCEPT ILLUSTRATION · OPEN MOON</text>
</svg>
