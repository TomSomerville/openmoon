<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Share Tech Mono, monospace" role="img" aria-labelledby="t d">
<title id="t">Open Moon crew rotation: crews of 3, a new crew every 3 months, 2-week handovers</title>
<desc id="d">Timeline of the first 18 months of the crewed base. Crews 1 to 6, each of 3 people, land 3 months apart and each stays about 6.5 months, so each crew leaves 2 weeks after the crew two places behind it lands. The headcount strip shows 3 people for the first 3 months, then 6, rising to 9 for 2 weeks at months 6, 9, 12 and 15. That is 4 crew arrivals and 4 departures a year.</desc>
