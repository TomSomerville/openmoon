<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Share Tech Mono, monospace" role="img" aria-labelledby="t d">
<title id="t">How KRUSTY works</title>
<desc id="d">Heat flows from the uranium core through sodium heat pipes to Stirling engines, which drive linear alternators. Controllers turn the alternator output into usable electricity. Waste heat leaves through the cold end.</desc>
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(56,212,240,.07)"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb020"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38d4f0"/></marker>
</defs>
<rect width="960" height="540" fill="#0a1015"/><rect width="960" height="540" fill="url(#g)"/>
<text x="24" y="36" fill="#d6e2ec" font-size="19" letter-spacing="1">HOW KRUSTY WORKS · HEAT → MOTION → ELECTRICITY</text>
<text x="24" y="58" fill="#d6e2ec" font-size="12" opacity=".7">Ground test, Nevada, 2018. Numbers are measured test values (Poston 2020; Gibson 2018).</text>

<!-- vacuum chamber -->
<rect x="20" y="80" width="660" height="400" rx="14" fill="none" stroke="#38d4f0" stroke-dasharray="8 6" opacity=".5"/>
<text x="34" y="100" fill="#38d4f0" font-size="12" letter-spacing="1">VACUUM CHAMBER (SIMULATES SPACE)</text>

<!-- core block -->
<g>
<rect x="50" y="240" width="150" height="190" rx="8" fill="rgba(56,212,240,.10)" stroke="#38d4f0" stroke-width="2"/>
<rect x="80" y="262" width="90" height="146" rx="4" fill="rgba(255,176,32,.16)" stroke="#ffb020" stroke-width="2"/>
<text x="125" y="320" fill="#d6e2ec" font-size="13" text-anchor="middle">HEU U-Mo</text>
<text x="125" y="337" fill="#d6e2ec" font-size="13" text-anchor="middle">CORE</text>
<text x="125" y="356" fill="#d6e2ec" font-size="11" text-anchor="middle" opacity=".8">28 kg U-235</text>
<text x="125" y="452" fill="#d6e2ec" font-size="12" text-anchor="middle">BeO REFLECTOR</text>
<text x="125" y="467" fill="#d6e2ec" font-size="11" text-anchor="middle" opacity=".75">moves to control</text>
<path d="M60 430V470M190 430V470" stroke="#38d4f0" stroke-width="2"/>
<path d="M48 476h154" stroke="#38d4f0" stroke-width="3"/>
</g>
<text x="125" y="232" fill="#ffb020" font-size="12" text-anchor="middle">~4 kWt at 800 °C</text>

<!-- heat pipes -->
<g stroke="#ffb020" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M170 280C250 280 260 150 330 150"/>
<path d="M170 300C260 300 270 205 330 205"/>
<path d="M170 320C270 320 280 260 330 260"/>
<path d="M170 340C280 340 290 315 330 315"/>
<path d="M170 360C280 360 290 370 330 370"/>
<path d="M170 380C270 380 280 425 330 425"/>
</g>
<text x="215" y="452" fill="#d6e2ec" font-size="12">8 SODIUM HEAT PIPES</text>
<text x="215" y="467" fill="#d6e2ec" font-size="11" opacity=".75">no pumps: sodium evaporates and condenses</text>

<!-- converters -->
<g font-size="12" fill="#d6e2ec">
<rect x="330" y="132" width="150" height="36" rx="5" fill="rgba(56,212,240,.16)" stroke="#38d4f0" stroke-width="2"/><text x="405" y="155" text-anchor="middle">STIRLING ENGINE 1</text>
<rect x="330" y="187" width="150" height="36" rx="5" fill="rgba(56,212,240,.16)" stroke="#38d4f0" stroke-width="2"/><text x="405" y="210" text-anchor="middle">STIRLING ENGINE 2</text>
<rect x="330" y="242" width="150" height="36" rx="5" fill="none" stroke="#38d4f0" stroke-dasharray="4 4"/><text x="405" y="265" text-anchor="middle" opacity=".8">SIMULATOR</text>
<rect x="330" y="297" width="150" height="36" rx="5" fill="none" stroke="#38d4f0" stroke-dasharray="4 4"/><text x="405" y="320" text-anchor="middle" opacity=".8">SIMULATOR</text>
<rect x="330" y="352" width="150" height="36" rx="5" fill="none" stroke="#38d4f0" stroke-dasharray="4 4"/><text x="405" y="375" text-anchor="middle" opacity=".8">SIMULATOR</text>
<rect x="330" y="407" width="150" height="36" rx="5" fill="none" stroke="#38d4f0" stroke-dasharray="4 4"/><text x="405" y="430" text-anchor="middle" opacity=".8">SIMULATOR</text>
</g>
<text x="405" y="120" fill="#d6e2ec" font-size="12" text-anchor="middle">FREE-PISTON STIRLING + LINEAR ALTERNATOR</text>

<text x="496" y="392" fill="#d6e2ec" font-size="11" opacity=".85">Only 2 real engines.</text>
<text x="496" y="408" fill="#d6e2ec" font-size="11" opacity=".85">6 gas-cooled simulators</text>
<text x="496" y="424" fill="#d6e2ec" font-size="11" opacity=".85">mimic the heat draw of</text>
<text x="496" y="440" fill="#d6e2ec" font-size="11" opacity=".85">the other engines.</text>
<!-- alternator output -->
<g stroke="#38d4f0" stroke-width="2" fill="none" marker-end="url(#ac)">
<path d="M480 150H560"/><path d="M480 205H560"/>
</g>
<text x="520" y="142" fill="#d6e2ec" font-size="11" text-anchor="middle">AC</text>
<rect x="562" y="130" width="100" height="96" rx="6" fill="rgba(56,212,240,.08)" stroke="#38d4f0" stroke-width="2"/>
<text x="612" y="168" fill="#d6e2ec" font-size="12" text-anchor="middle">ENGINE</text>
<text x="612" y="184" fill="#d6e2ec" font-size="12" text-anchor="middle">CONTROLLERS</text>
<text x="612" y="202" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".75">sync engine +</text>
<text x="612" y="214" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".75">balancer</text>

<!-- out of chamber: electricity -->
<path d="M662 178H760" stroke="#38d4f0" stroke-width="3" fill="none" marker-end="url(#ac)"/>
<rect x="762" y="128" width="176" height="100" rx="8" fill="rgba(56,212,240,.12)" stroke="#38d4f0" stroke-width="2"/>
<text x="850" y="158" fill="#38d4f0" font-size="14" text-anchor="middle">ELECTRICITY</text>
<text x="850" y="180" fill="#d6e2ec" font-size="12" text-anchor="middle">95 We + 88 We</text>
<text x="850" y="197" fill="#d6e2ec" font-size="12" text-anchor="middle">= 183 We max</text>
<text x="850" y="216" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".75">30–34% engine efficiency</text>

<!-- waste heat -->
<path d="M480 300C560 300 600 330 760 330" stroke="#ffb020" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<rect x="762" y="290" width="176" height="86" rx="8" fill="rgba(255,176,32,.08)" stroke="#ffb020" stroke-width="2"/>
<text x="850" y="318" fill="#ffb020" font-size="14" text-anchor="middle">WASTE HEAT</text>
<text x="850" y="340" fill="#d6e2ec" font-size="11" text-anchor="middle">test: gas cooling</text>
<text x="850" y="357" fill="#d6e2ec" font-size="11" text-anchor="middle">flight: radiator to space</text>

<!-- feedback note -->
<rect x="700" y="404" width="238" height="112" rx="8" fill="none" stroke="#38d4f0" opacity=".6"/>
<text x="712" y="426" fill="#38d4f0" font-size="12">SELF-REGULATING CORE</text>
<text x="712" y="446" fill="#d6e2ec" font-size="11">Engines draw more heat →</text>
<text x="712" y="462" fill="#d6e2ec" font-size="11">fuel cools and shrinks →</text>
<text x="712" y="478" fill="#d6e2ec" font-size="11">more fission → power rises.</text>
<text x="712" y="498" fill="#d6e2ec" font-size="11" opacity=".8">Load swings &gt;175%: core within 4%</text>
<text x="712" y="512" fill="#d6e2ec" font-size="11" opacity=".8">of its 800 °C setpoint.</text>

<text x="24" y="528" fill="#d6e2ec" font-size="10" opacity=".6" letter-spacing="1">DIAGRAM · OPEN MOON · CC BY-SA 4.0 · SCHEMATIC, NOT TO SCALE</text>
</svg>
