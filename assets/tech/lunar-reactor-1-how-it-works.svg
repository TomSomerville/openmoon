<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Share Tech Mono, monospace" role="img" aria-labelledby="t d">
<title id="t">How Lunar Reactor-1 is meant to work</title>
<desc id="d">A HALEU reactor heats a gas through a heat exchanger. In a closed Brayton loop the hot gas spins a turbine on one shaft with a compressor and alternator. A recuperator recovers heat and a radiator rejects waste heat. Power electronics send 3 kV AC to the user; spare power goes to a parasitic load radiator.</desc>
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(56,212,240,.07)"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb020"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38d4f0"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d6e2ec"/></marker>
</defs>
<rect width="960" height="560" fill="#0a1015"/><rect width="960" height="560" fill="url(#g)"/>
<text x="24" y="36" fill="#d6e2ec" font-size="19" letter-spacing="1">LUNAR REACTOR-1 · CLOSED BRAYTON FISSION POWER (REQUIRED LAYOUT)</text>
<text x="24" y="58" fill="#d6e2ec" font-size="12" opacity=".7">From NASA's SPARC Industry Day block diagram (Sep 2026). No design selected; parts generic.</text>

<!-- reactor + shield -->
<rect x="30" y="160" width="140" height="190" rx="10" fill="rgba(255,176,32,.14)" stroke="#ffb020" stroke-width="2"/>
<text x="100" y="240" fill="#d6e2ec" font-size="14" text-anchor="middle">HALEU</text>
<text x="100" y="258" fill="#d6e2ec" font-size="14" text-anchor="middle">REACTOR</text>
<text x="100" y="280" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".75">~20% U-235</text>
<path d="M180 150V360" stroke="#38d4f0" stroke-width="10" opacity=".55"/>
<text x="186" y="380" fill="#d6e2ec" font-size="11" text-anchor="middle">SHIELD</text>
<path d="M30 400L-10 470M170 400L210 470" stroke="#38d4f0" stroke-dasharray="4 5" opacity=".6"/>
<text x="100" y="430" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".8">36° cone toward crew:</text>
<text x="100" y="444" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".8">&lt;5 rem/yr at 1 km</text>

<!-- heat source HX -->
<path d="M170 255H240" stroke="#ffb020" stroke-width="4" marker-end="url(#ah)"/>
<rect x="242" y="215" width="110" height="80" rx="6" fill="rgba(255,176,32,.10)" stroke="#ffb020" stroke-width="2"/>
<text x="297" y="250" fill="#d6e2ec" font-size="12" text-anchor="middle">HEAT SOURCE</text>
<text x="297" y="266" fill="#d6e2ec" font-size="12" text-anchor="middle">HX (HSHX)</text>

<!-- Brayton loop box -->
<rect x="380" y="100" width="340" height="330" rx="14" fill="none" stroke="#38d4f0" stroke-dasharray="8 6" opacity=".55"/>
<text x="392" y="120" fill="#38d4f0" font-size="12" letter-spacing="1">CLOSED BRAYTON LOOP (PCS) · SEALED GAS</text>

<!-- turbine/compressor/alternator on shaft -->
<path d="M420 210H700" stroke="#d6e2ec" stroke-width="3"/>
<polygon points="430,180 480,192 480,228 430,240" fill="rgba(56,212,240,.14)" stroke="#38d4f0" stroke-width="2"/>
<text x="455" y="172" fill="#d6e2ec" font-size="11" text-anchor="middle">COMPRESSOR</text>
<polygon points="540,192 590,180 590,240 540,228" fill="rgba(255,176,32,.14)" stroke="#ffb020" stroke-width="2"/>
<text x="565" y="172" fill="#d6e2ec" font-size="11" text-anchor="middle">TURBINE</text>
<rect x="620" y="182" width="76" height="56" rx="6" fill="rgba(56,212,240,.18)" stroke="#38d4f0" stroke-width="2"/>
<text x="658" y="207" fill="#d6e2ec" font-size="11" text-anchor="middle">ALTER-</text>
<text x="658" y="221" fill="#d6e2ec" font-size="11" text-anchor="middle">NATOR</text>
<text x="560" y="148" fill="#d6e2ec" font-size="11" text-anchor="middle" opacity=".8">one shaft · gas bearings</text>

<!-- recuperator + cooler -->
<rect x="440" y="320" width="120" height="44" rx="6" fill="rgba(56,212,240,.08)" stroke="#38d4f0" stroke-width="2"/>
<text x="500" y="346" fill="#d6e2ec" font-size="12" text-anchor="middle">RECUPERATOR</text>
<rect x="590" y="320" width="110" height="44" rx="6" fill="rgba(56,212,240,.08)" stroke="#38d4f0" stroke-width="2"/>
<text x="645" y="340" fill="#d6e2ec" font-size="11" text-anchor="middle">GAS COOLER</text>
<text x="645" y="354" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".75">to radiator loop</text>

<!-- gas path -->
<g fill="none" stroke-width="2">
<path d="M352 240H400V210H425" stroke="#ffb020" marker-end="url(#ah)"/>
<path d="M590 225C610 290 560 300 545 318" stroke="#ffb020" marker-end="url(#ah)"/>
<path d="M560 352H588" stroke="#38d4f0" marker-end="url(#ac)"/>
<path d="M645 366V400H420V250H428" stroke="#38d4f0" marker-end="url(#ac)"/>
<path d="M480 230C480 290 470 300 470 318" stroke="#38d4f0" marker-end="url(#ac)"/>
<path d="M440 330C380 330 360 300 352 290" stroke="#ffb020" marker-end="url(#ah)"/>
</g>
<text x="398" y="300" fill="#d6e2ec" font-size="10" opacity=".75" transform="rotate(-90 398 300)">cold gas</text>
<text x="550" y="448" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".75">compressor → recuperator → heater → turbine → recuperator → cooler → compressor</text>

<!-- radiator -->
<path d="M700 342H856" stroke="#ffb020" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<g stroke="#ffb020" stroke-width="2" fill="rgba(255,176,32,.06)">
<rect x="866" y="300" width="20" height="120"/><rect x="892" y="300" width="20" height="120"/><rect x="918" y="300" width="20" height="120"/>
</g>
<text x="900" y="440" fill="#d6e2ec" font-size="12" text-anchor="middle">HEAT REJECTION</text>
<text x="900" y="455" fill="#d6e2ec" font-size="12" text-anchor="middle">RADIATORS (HRS)</text>
<text x="900" y="471" fill="#d6e2ec" font-size="10" text-anchor="middle" opacity=".75">to the 4 K sky</text>

<!-- electrical -->
<path d="M696 210H760" stroke="#38d4f0" stroke-width="3" marker-end="url(#ac)"/>
<rect x="762" y="160" width="170" height="100" rx="8" fill="rgba(56,212,240,.12)" stroke="#38d4f0" stroke-width="2"/>
<text x="847" y="190" fill="#38d4f0" font-size="13" text-anchor="middle">CONTROLLER</text>
<text x="847" y="207" fill="#38d4f0" font-size="13" text-anchor="middle">&amp; PMAD</text>
<text x="847" y="230" fill="#d6e2ec" font-size="11" text-anchor="middle">steps up to 3 kV RMS AC</text>
<text x="847" y="246" fill="#d6e2ec" font-size="11" text-anchor="middle">load 0–100%</text>
<path d="M847 160V110" stroke="#38d4f0" stroke-width="3" marker-end="url(#ac)"/>
<rect x="762" y="70" width="170" height="40" rx="8" fill="rgba(56,212,240,.2)" stroke="#38d4f0" stroke-width="2"/>
<text x="847" y="95" fill="#d6e2ec" font-size="12" text-anchor="middle">≥20 kWe → USER CABLE</text>
<path d="M800 260V502H762" stroke="#38d4f0" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#ac)"/>
<rect x="640" y="480" width="118" height="44" rx="6" fill="none" stroke="#38d4f0" stroke-dasharray="4 4"/>
<text x="699" y="499" fill="#d6e2ec" font-size="11" text-anchor="middle">PARASITIC LOAD</text>
<text x="699" y="513" fill="#d6e2ec" font-size="11" text-anchor="middle">RADIATOR (PLR)</text>
<text x="630" y="498" fill="#d6e2ec" font-size="11" opacity=".85" text-anchor="end">Unused power is dumped here as heat,</text>
<text x="630" y="513" fill="#d6e2ec" font-size="11" opacity=".85" text-anchor="end">so the converter always sees full load.</text>

<text x="24" y="548" fill="#d6e2ec" font-size="10" opacity=".6" letter-spacing="1">DIAGRAM · OPEN MOON · CC BY-SA 4.0 · SCHEMATIC, NOT TO SCALE</text>
</svg>
