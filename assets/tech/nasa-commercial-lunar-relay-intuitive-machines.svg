<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Commercial lunar data relay concept">
<title>Commercial lunar data relay concept</title>
<defs><pattern id="g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="rgba(56,212,240,.07)" stroke-width="1"/></pattern></defs>
<style>.l{fill:none;stroke:#38d4f0;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.f{fill:rgba(56,212,240,.08);stroke:#38d4f0;stroke-width:2;stroke-linejoin:round}.a{fill:none;stroke:#ffb020;stroke-width:2;stroke-linecap:round}.af{fill:#ffb020}.t{fill:#d6e2ec;font-family:"Share Tech Mono",monospace;font-size:14px}.s{font-size:12px}.c{fill:none;stroke:#d6e2ec;stroke-width:1;opacity:.6}.d{stroke-dasharray:6 5}</style>
<rect width="800" height="500" fill="#0a1015"/><rect width="800" height="500" fill="url(#g)"/>
<!-- Commercial lunar data relay concept -->
<!-- Moon -->
<path class="f" d="M0 500 V380 Q400 300 800 380 V500Z"/>
<!-- orbit -->
<path class="l d" d="M40 360 Q400 60 760 360" style="opacity:.5"/>
<!-- Earth -->
<circle class="f" cx="700" cy="70" r="40"/><path class="l" d="M672 52 q20 10 10 30 M705 40 q20 10 25 40" style="opacity:.6"/>
<!-- satellite -->
<g transform="translate(330,150)">
<rect class="f" x="-22" y="-18" width="44" height="36"/>
<rect class="f" x="-112" y="-10" width="82" height="20"/><path class="l" d="M-30 0h8 M22 0h8 M-85 -10v20 M-58 -10v20"/>
<rect class="f" x="30" y="-10" width="82" height="20"/><path class="l" d="M57 -10v20 M84 -10v20"/>
<path class="f" d="M-14 18 Q0 40 14 18" /><path class="l" d="M0 18v-4"/>
<path class="f" d="M14 -18 L34 -46 Q20 -56 6 -40Z"/>
</g>
<!-- links -->
<path class="a d" d="M360 110 L662 80"/>
<path class="a d" d="M330 190 L250 372"/>
<path class="a d" d="M345 188 L520 362"/>
<!-- surface users -->
<rect class="f" x="230" y="372" width="34" height="18"/><path class="l" d="M232 390 l-8 12 M262 390 l8 12 M247 372 v-12"/>
<rect class="f" x="505" y="362" width="40" height="16" rx="4"/><circle class="l" cx="512" cy="382" r="6"/><circle class="l" cx="538" cy="382" r="6"/>
<!-- callouts -->
<text class="t" x="60" y="92">RELAY SATELLITE</text><text class="t s" x="60" y="110">IN LUNAR ORBIT</text>
<text class="t" x="470" y="70">EARTH LINK</text>
<text class="t" x="560" y="310">SURFACE USER LINKS</text><text class="t s" x="560" y="328">+ POSITION / NAVIGATION / TIMING</text>
<text class="t s" x="150" y="420">LANDER</text><text class="t s" x="490" y="410">ROVER</text>
<text class="t s" x="20" y="30">COMMERCIAL LUNAR RELAY SERVICE</text>
<text class="t s" x="20" y="485" fill-opacity=".8">CONCEPT ILLUSTRATION · OPEN MOON</text>
</svg>
