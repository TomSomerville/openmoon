<!-- notes -->
<g font-size="10" fill="#d6e2ec">
<text x="16" y="490" fill="#d6e2ec" font-size="12">WHY (sources on the pages that use this diagram)</text>
<text x="16" y="510">· NASA: a DC grid is limited to 1.2–1.5 kV for lack of rad-hard high-voltage switches.</text>
<text x="16" y="526">· NASA: at 100 kW on 8 AWG, 1 kHz: 3 kV to ~600 m, 6 kV to 2.5 km, 18 kV for 20 km.</text>
<text x="16" y="542">· 1 kW at 12 V ≈ 83 A: only ~1.4 m one-way on 10 mm² Al for 5% loss (this plan's arithmetic).</text>
<text x="16" y="558">· 20 kW over 3 km at 3 kV: 3.85 A; ~5.9 mm² Al for ≤3% loss (this plan's arithmetic).</text>
</g>
