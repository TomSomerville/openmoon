<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Share Tech Mono, monospace" role="img" aria-labelledby="t d">
<title id="t">Source-end conversion to 3 kV AC (DD-013)</title>
<desc id="d">Three rows show how each power source makes 3 kV AC, 3-phase, 1 kHz right where it stands, then sends it over no more than 3 km of cable to the power management controller (PMC). Row 1, VSAT solar tower: the array makes DC at a voltage that is not published (the ISS arrays hold about 160 V DC); an array regulator and shunt holds the bus and curtails or disconnects on PMC command; a UMIC-class inverter of parallel 1 kW modules turns DC into under 100 V AC; a 1 kHz step-up transformer raises it to 3 kV AC. Row 2, KRUSTY-class Kilopower unit: eight Stirling engines in opposed pairs each make single-phase AC at about 12 V RMS, 100 Hz and 7 to 10 A (values for the Advanced Stirling Convertor family); one controller per engine rectifies to DC and holds a set voltage; the controller outputs share one DC bus, whose voltage is not published; a UMIC-class inverter and a 1 kHz transformer make 3 kV AC. The 12 V never leaves the machine. Row 3, LR-1-class reactor: closed Brayton alternators (NASA's 2025 reference gave 240 Vrms at 2 kHz) and the vendor's power electronics deliver 3 kV RMS AC; the plan requires 3 kV, 3-phase, 1 kHz at the reactor output, either specified to the vendor or made by a frequency converter at the reactor end, which is open. Only low-voltage switches are used; the transformer does the step-up and has no switches.</desc>
<defs>
